name: mr-review-fix
description: "5-step GitLab MR review-feedback responder: ingest → Claude triages all comments + fixes → reply on MR → notify Teams → cleanup."

# Wired to a Job whose source is gitlab.list_mr_notes (single-MR watch)
# or gitlab.list_my_todos (all-MR watch). Recipe input_template fills:
#   project, mr_iid, gitlab_project_id, feedback, reviewer, mr_url,
#   triage_instructions (optional)
#
# Prereqs:
#   - glab CLI authenticated  (brew install glab && glab auth login)
#   - jq  (brew install jq)
#   - The local project's git remote `origin` points at the same GitLab host

input:
  project: "Local Forge project name (e.g. FortiNAC)"
  mr_iid: "GitLab MR iid"
  gitlab_project_id: "GitLab project — numeric id OR namespace/repo path"
  feedback: "The new comment that triggered this run"
  reviewer: "Username of the comment author"
  mr_url: "Full MR URL (used in Teams notification)"
  # Free-form policy passed to the AI triage step. Leave empty for
  # sensible defaults (skip self/system/lgtm/approvals; act on
  # substantive defects).
  triage_instructions: ""

nodes:
  # ── 1. Ingest — fetch MR metadata, all comments, the diff ──
  #
  # Single source of truth for everything downstream nodes need: source
  # branch, target branch, comment history, the current diff. Writes
  # them to /tmp files so Claude can read them in step 2 without
  # blowing up the prompt.
  ingest:
    project: "{{input.project}}"
    worktree: false
    mode: shell
    prompt: |
      set -e
      PROJECT_ID="{{input.gitlab_project_id}}"
      MR_IID="{{input.mr_iid}}"
      # URL-encode namespace/repo style ids for the API path.
      PID_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$PROJECT_ID")
      META=/tmp/mr-${MR_IID}-meta.json
      NOTES=/tmp/mr-${MR_IID}-notes.json
      DIFF=/tmp/mr-${MR_IID}-diff.txt
      glab api "projects/${PID_ENC}/merge_requests/${MR_IID}" > "$META"
      glab api "projects/${PID_ENC}/merge_requests/${MR_IID}/notes?per_page=100&sort=asc" > "$NOTES"
      glab api "projects/${PID_ENC}/merge_requests/${MR_IID}/changes" \
        --jq '.changes[] | "=== \(.new_path) ===\n\(.diff)"' > "$DIFF"
      SRC=$(jq -r '.source_branch' "$META")
      TGT=$(jq -r '.target_branch' "$META")
      TITLE=$(jq -r '.title' "$META")
      AUTHOR=$(jq -r '.author.username' "$META")
      # Stable KEY=value lines downstream nodes parse via:
      #   eval "$(echo "$CTX" | grep -E '^[A-Z_]+=' | sed 's/^/export /')"
      echo "SOURCE_BRANCH=${SRC}"
      echo "TARGET_BRANCH=${TGT}"
      echo "MR_TITLE=${TITLE}"
      echo "MR_AUTHOR=${AUTHOR}"
      echo "META_FILE=${META}"
      echo "NOTES_FILE=${NOTES}"
      echo "DIFF_FILE=${DIFF}"
    outputs:
      - name: ctx
        extract: stdout

  # ── 2. Triage + Fix — Claude reads everything, decides, fixes ──
  #
  # ONE Claude node handles the whole "is this actionable + apply the
  # fix" loop. Reads the comment history holistically — not just the
  # one note that triggered this run — so if a reviewer asked for X
  # five comments ago and another comment already addressed X, the
  # triage knows.
  #
  # Worktree: orchestrator creates `.forge/worktrees/mr-<iid>` on
  # branch `mr-{{input.mr_iid}}`. Claude first aligns that branch with
  # origin/<source_branch> (so the fix is built on the right base),
  # then edits, commits, pushes HEAD back to the MR's source_branch.
  triage-and-fix:
    project: "{{input.project}}"
    branch: "mr-{{input.mr_iid}}"
    depends_on: [ingest]
    prompt: |
      You're addressing review feedback on GitLab MR
      !{{input.mr_iid}} — "{{input.feedback}}" was the new comment
      from @{{input.reviewer}} that triggered this run.

      ## Triage policy
      {{input.triage_instructions}}

      (If the above is blank, use defaults: ACT only on substantive
       feedback that names a concrete defect, missing test, security
       concern, or specific refactor request. SKIP self-comments,
       system notes, "lgtm" / approvals, style nits, comments that
       just ask questions without proposing a fix.)

      ## Files at your disposal
      Parse the ingest output (key=value lines):

      ```
      {{nodes.ingest.outputs.ctx}}
      ```

      That gives you `SOURCE_BRANCH`, `TARGET_BRANCH`, `MR_TITLE`,
      `MR_AUTHOR`, plus paths to:
        - `META_FILE`  — full MR metadata (JSON)
        - `NOTES_FILE` — all comments on the MR, sorted ascending
                         (latest at the bottom). Each entry has
                         `body, author, system, created_at`. Skip
                         entries where `system: true`.
        - `DIFF_FILE`  — current diff being reviewed

      ## Your task
      1. Read NOTES_FILE + DIFF_FILE. Analyze the comments
         **holistically** — the comment that triggered this run is the
         last one, but earlier comments may already be addressed,
         contradicted, or relevant context.
      2. Decide ACT vs SKIP per the triage policy.

      ### If SKIP
      Write 1-3 sentences explaining why (will be posted on the MR by
      the next step). End your reply with EXACTLY this line on its
      own:
          ACTION: skipped

      ### If ACT
      a. Align the orchestrator-managed worktree with `origin/$SOURCE_BRANCH`:
           cd "$FORGE_WORKTREE"        # already in the worktree
           git fetch origin "$SOURCE_BRANCH"
           git reset --hard "origin/$SOURCE_BRANCH"
      b. Make ONLY the changes the comments call for. Stay narrow —
         do not touch unrelated files.
      c. Commit + push to the MR's source branch:
           git add -A
           git commit -m "fix: address review feedback on !{{input.mr_iid}}"
           git push origin "HEAD:$SOURCE_BRANCH"
      d. Write 1-3 sentences summarizing what you changed (will be
         posted on the MR). End your reply with EXACTLY this line on
         its own:
            ACTION: pushed

      The downstream `reply` node greps for `ACTION: pushed` or
      `ACTION: skipped` to decide what to post — keep the marker on
      its own line at the very end of your reply.
    outputs:
      - name: reasoning
        extract: result

  # ── 3. Reply on the MR ───────────────────────────────────
  #
  # Post Claude's reasoning back as a comment so the reviewer can see
  # the outcome. The body branches on the ACTION: marker.
  reply:
    project: "{{input.project}}"
    worktree: false
    depends_on: [triage-and-fix]
    mode: shell
    prompt: |
      set -e
      PROJECT_ID="{{input.gitlab_project_id}}"
      MR_IID="{{input.mr_iid}}"
      PID_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$PROJECT_ID")
      REASONING=$(cat <<'FORGE_R_EOF'
      {{nodes.triage-and-fix.outputs.reasoning}}
      FORGE_R_EOF
      )
      if echo "$REASONING" | grep -Eq '(^|[[:space:]])ACTION:[[:space:]]*pushed([[:space:]]|$)'; then
        BODY="🤖 Forge: 已根据 @{{input.reviewer}} 的反馈推送 fixup commit。\n\n${REASONING}"
        STATUS="pushed"
      elif echo "$REASONING" | grep -Eq '(^|[[:space:]])ACTION:[[:space:]]*skipped([[:space:]]|$)'; then
        BODY="🤖 Forge: 已 review 这条评论,**判断无需修改**。\n\n${REASONING}"
        STATUS="skipped"
      else
        BODY="⚠️ Forge: triage 未输出 ACTION 标记,需要人工 review。\n\n${REASONING}"
        STATUS="unknown"
      fi
      echo "STATUS=${STATUS}"
      glab api "projects/${PID_ENC}/merge_requests/${MR_IID}/notes" \
        -X POST -f body="$(printf '%b' "$BODY")" --jq '.id' \
        && echo "REPLY_POSTED=true" \
        || echo "REPLY_POSTED=false"
    outputs:
      - name: result
        extract: stdout

  # ── 4. Notify Teams ──────────────────────────────────────
  #
  # Best-effort. If the teams connector isn't set up the curl will
  # fail and we log + continue — don't fail the pipeline over a
  # notification.
  notify:
    project: "{{input.project}}"
    worktree: false
    depends_on: [reply]
    mode: shell
    prompt: |
      set +e
      INFO=$'{{nodes.ingest.outputs.ctx}}'
      eval "$(echo "$INFO" | grep -E '^[A-Z_]+=' | sed 's/^/export /')"
      STATUS_OUT=$'{{nodes.reply.outputs.result}}'
      eval "$(echo "$STATUS_OUT" | grep -E '^[A-Z_]+=' | sed 's/^/export /')"
      MSG="🤖 Forge auto-handled MR review comment: ${MR_TITLE} (${STATUS:-?})

      Reviewer: @{{input.reviewer}}
      MR: {{input.mr_url}}"
      PAYLOAD=$(jq -n --arg user "$MR_AUTHOR" --arg msg "$MSG" \
        '{plugin_id:"teams", tool:"send_message", input:{chat_name:$user, message:$msg}}')
      curl -sS -X POST http://127.0.0.1:8403/api/connector-tool \
        -H 'content-type: application/json' --data "$PAYLOAD" \
        > /dev/null 2>&1 \
        && echo "Notified @${MR_AUTHOR} on Teams" \
        || echo "Teams notify skipped (connector not set up or unreachable)"
    outputs:
      - name: status
        extract: stdout

  # ── 5. Cleanup ───────────────────────────────────────────
  cleanup:
    project: "{{input.project}}"
    worktree: false
    depends_on: [notify]
    mode: shell
    prompt: |
      set +e
      ROOT=$(git rev-parse --show-toplevel)
      WT="$ROOT/.forge/worktrees/mr-{{input.mr_iid}}"
      if [ -d "$WT" ]; then
        git worktree remove --force "$WT" 2>/dev/null \
          && echo "Removed worktree $WT" \
          || echo "Worktree $WT not removed (may still hold local changes)"
      fi
      git worktree prune
      rm -f /tmp/mr-{{input.mr_iid}}-meta.json /tmp/mr-{{input.mr_iid}}-notes.json /tmp/mr-{{input.mr_iid}}-diff.txt
      echo "Cleanup done"
    outputs:
      - name: status
        extract: stdout
