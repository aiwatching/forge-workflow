name: mr-review-fix
description: "GitLab MR review-feedback responder. Claude triages each new comment based on your natural-language instructions, then (if actionable) checks out the source branch and pushes a fixup commit."

# Wired to either:
#   A) gitlab.list_my_todos  (action_name=review_submitted, target_type=MergeRequest)
#   B) gitlab.list_mr_notes  (per-MR poll; project_id + mr_iid pinned in source_input)
#
# Both shapes are covered by the input_template baked into the recipes
# under recipes/gitlab-*-watch/recipe.yaml.
#
# Prereqs:
#   - `glab` CLI authenticated (`brew install glab && glab auth login`).
#   - Local project's git remote `origin` points at the same GitLab host.

input:
  project: "Local Forge project name (e.g. FortiNAC)"
  mr_iid: "GitLab MR iid"
  gitlab_project_id: "GitLab numeric project id"
  feedback: "The reviewer's comment body"
  reviewer: "Username of who left the feedback"
  action: "Todo action_name (review_submitted | mentioned | ...) — or 'manual' for testing"
  mr_title: "MR title for context"
  mr_url: "URL to the MR"
  # Free-form instructions for the triage node. Describe in plain text
  # WHEN to act and WHEN to skip. Leave empty for sensible defaults
  # (skip self / system / lgtm / approvals; act on substantive feedback).
  # Example:
  #   "Only act if the comment points at a specific code defect or test
  #    gap. Skip nits about formatting, naming style, comments-only,
  #    'looks good' / approvals, and anything from @ci-bot."
  triage_instructions: ""

nodes:
  # ── 1. Triage — Claude reads the comment and decides ACT vs SKIP ──
  #
  # Replaces the old vars-based regex/whitelist machinery with a single
  # natural-language gate. The user describes their policy in plain
  # text; Claude applies judgment per comment. Falls back to sensible
  # defaults when triage_instructions is empty.
  triage:
    project: "{{input.project}}"
    branch: "mr-{{input.mr_iid}}"
    prompt: |
      You are deciding whether a GitLab MR review comment requires a
      code fix in this branch.

      ## User's triage policy
      {{input.triage_instructions}}

      (If the section above is blank, use these defaults:
       - SKIP if the reviewer is the MR author themselves (self-loop).
       - SKIP if the comment is GitLab-generated (label changes, "marked
         as draft", "requested review from X", etc.).
       - SKIP approvals / acks / emoji-only / "lgtm" / "thanks".
       - SKIP nits that don't point at a specific code defect.
       - ACT on substantive feedback that names a bug, missing test,
         needed refactor, or specific code change.)

      ## Comment context
      MR:       !{{input.mr_iid}} — {{input.mr_title}}
      Reviewer: @{{input.reviewer}}
      Action:   {{input.action}}

      Body:
      ```
      {{input.feedback}}
      ```

      ## Output format
      Write a one- or two-sentence reasoning above, then end with
      EXACTLY one of these lines on its own:

        DECISION: ACT
        DECISION: SKIP

      No code, no tool calls, no file edits in this step — that comes
      later if you decide ACT.
    outputs:
      - name: reasoning
        extract: result
      - name: decision
        extract: result
        pattern: "DECISION:\\s*(ACT|SKIP)"

  # ── 2. Gate — short-circuit the pipeline if triage said SKIP ──
  gate:
    mode: shell
    project: "{{input.project}}"
    worktree: false
    depends_on: [triage]
    prompt: |
      DECISION='{{nodes.triage.outputs.decision}}'
      case "$DECISION" in
        ACT)
          echo "PROCEED — Claude triage said ACT"
          ;;
        SKIP)
          echo "SKIP by triage:"
          echo "{{nodes.triage.outputs.reasoning}}"
          exit 1
          ;;
        *)
          echo "Triage produced no DECISION line — defaulting to SKIP for safety."
          echo "Reasoning was:"
          echo "{{nodes.triage.outputs.reasoning}}"
          exit 1
          ;;
      esac
    outputs:
      - name: status
        extract: stdout

  # ── 3. Find the MR's source branch via GitLab API ──────
  resolve-branch:
    mode: shell
    project: "{{input.project}}"
    worktree: false
    depends_on: [gate]
    prompt: |
      SRC=$(glab api "projects/{{input.gitlab_project_id}}/merge_requests/{{input.mr_iid}}" --jq '.source_branch') && \
      if [ -z "$SRC" ]; then echo "ERROR: failed to resolve source_branch" && exit 1; fi && \
      echo "$SRC"
    outputs:
      - name: source_branch
        extract: stdout

  # ── 4. Checkout the MR's source branch in an isolated worktree ──
  checkout:
    mode: shell
    project: "{{input.project}}"
    branch: "mr-{{input.mr_iid}}"
    depends_on: [resolve-branch]
    prompt: |
      git fetch origin && \
      git checkout "{{nodes.resolve-branch.outputs.source_branch}}" && \
      git pull --ff-only origin "{{nodes.resolve-branch.outputs.source_branch}}" && \
      echo "HEAD: $(git rev-parse --short HEAD) on $(git branch --show-current)"
    outputs:
      - name: head
        extract: stdout

  # ── 5. Dump the current MR diff so Claude sees what reviewer saw ──
  fetch-diff:
    mode: shell
    project: "{{input.project}}"
    branch: "mr-{{input.mr_iid}}"
    depends_on: [checkout]
    prompt: |
      glab api "projects/{{input.gitlab_project_id}}/merge_requests/{{input.mr_iid}}/changes" \
        --jq '.changes[] | "=== \(.new_path) ===\n\(.diff)"' > "/tmp/mr-{{input.mr_iid}}-diff.txt" && \
      wc -l "/tmp/mr-{{input.mr_iid}}-diff.txt"
    outputs:
      - name: meta
        extract: stdout

  # ── 6. Claude applies the fix ───────────────────────
  apply-fix:
    project: "{{input.project}}"
    branch: "mr-{{input.mr_iid}}"
    depends_on: [fetch-diff]
    prompt: |
      You're addressing a review comment on GitLab MR !{{input.mr_iid}}
      — "{{input.mr_title}}".

      The triage step already decided this comment is actionable:
      ```
      {{nodes.triage.outputs.reasoning}}
      ```

      ## Reviewer feedback (from @{{input.reviewer}})
      ```
      {{input.feedback}}
      ```

      ## Current MR diff
      Full diff at `/tmp/mr-{{input.mr_iid}}-diff.txt`. Read it first.

      ## Task
      1. Understand the existing diff.
      2. Apply ONLY the change(s) the reviewer asked for. Stay narrow —
         do NOT touch unrelated files; do NOT amend the previous commit;
         make a new commit so history reflects the response.
      3. End with `ACTION: changes` if you made edits, `ACTION: none`
         if you concluded nothing actionable after closer inspection
         (rare — triage already gated this).

  # ── 7. Commit + push (or skip if no edits) ─────────────
  commit-push:
    mode: shell
    project: "{{input.project}}"
    branch: "mr-{{input.mr_iid}}"
    depends_on: [apply-fix]
    prompt: |
      if [ -z "$(git status --porcelain)" ]; then
        echo "STATUS=no-changes" && exit 0
      fi && \
      git add -A && \
      git commit -m "fix: address review feedback from @{{input.reviewer}} on !{{input.mr_iid}}" \
                 -m "{{input.feedback}}" && \
      git push origin "{{nodes.resolve-branch.outputs.source_branch}}" && \
      echo "STATUS=pushed" && \
      git log -1 --oneline
    outputs:
      - name: status
        extract: stdout

  # ── 8. Post a reply note so reviewer sees the response ──
  reply:
    mode: shell
    project: "{{input.project}}"
    worktree: false
    depends_on: [commit-push]
    prompt: |
      STATUS_OUT="{{nodes.commit-push.outputs.status}}"
      if echo "$STATUS_OUT" | grep -q "STATUS=no-changes"; then
        echo "No code changes — not posting reply" && exit 0
      fi
      BODY="🤖 Forge: 已根据 @{{input.reviewer}} 的反馈推送了一个 fixup commit,请 review。"
      glab api "projects/{{input.gitlab_project_id}}/merge_requests/{{input.mr_iid}}/notes" \
        -X POST -f body="$BODY" \
        --jq '.id' && \
      echo "Reply posted"
    outputs:
      - name: posted
        extract: stdout
