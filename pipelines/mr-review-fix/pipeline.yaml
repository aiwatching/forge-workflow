name: mr-review-fix
description: "5-step GitLab MR review responder. Step 2 is pure AI analysis (works with any Claude profile incl. API-only). Step 3 only fires when triage said ACT — does git fetch+reset, edits, commit, push."

# Wired to a Job whose source is gitlab.list_mr_notes (single-MR watch)
# or gitlab.list_my_todos (all-MR watch). Recipe input_template fills:
#   project, mr_iid, gitlab_project_id, feedback, reviewer, mr_url,
#   triage_instructions (optional)
#
# Prereqs:
#   - glab CLI authenticated
#   - jq installed
#   - The `fix` step (3) needs Claude with shell access — i.e. a CLI
#     agent profile (Claude Code), not API-only. Triage (step 2) is
#     pure analysis so any profile works there.

input:
  project: "Local Forge project name (e.g. FortiNAC)"
  mr_iid: "GitLab MR iid"
  gitlab_project_id: "GitLab project — numeric id OR namespace/repo path"
  feedback: "The new comment that triggered this run"
  reviewer: "Username of the comment author"
  mr_url: "Full MR URL (used in Teams notification)"
  triage_instructions: ""

nodes:
  # ── 1. Ingest — fetch MR metadata, all comments, the diff ──
  ingest:
    project: "{{input.project}}"
    worktree: false
    mode: shell
    prompt: |
      set -e
      PROJECT_ID="{{input.gitlab_project_id}}"
      MR_IID="{{input.mr_iid}}"
      PID_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$PROJECT_ID")
      META=/tmp/mr-${MR_IID}-meta.json
      NOTES=/tmp/mr-${MR_IID}-notes.json
      DIFF=/tmp/mr-${MR_IID}-diff.txt
      glab api "projects/${PID_ENC}/merge_requests/${MR_IID}" > "$META"
      glab api "projects/${PID_ENC}/merge_requests/${MR_IID}/notes?per_page=100&sort=asc" > "$NOTES"
      glab api "projects/${PID_ENC}/merge_requests/${MR_IID}/changes" \
        --jq '.changes[] | "=== \(.new_path) ===\n\(.diff)"' > "$DIFF"
      SRC=$(jq -r '.source_branch' "$META")
      TGT=$(jq -r '.target_branch' "$META")
      TITLE=$(jq -r '.title' "$META")
      AUTHOR=$(jq -r '.author.username' "$META")
      # KEY=value lines for downstream `eval` parsing.
      echo "SOURCE_BRANCH=${SRC}"
      echo "TARGET_BRANCH=${TGT}"
      echo "MR_TITLE=${TITLE}"
      echo "MR_AUTHOR=${AUTHOR}"
      echo "META_FILE=${META}"
      echo "NOTES_FILE=${NOTES}"
      echo "DIFF_FILE=${DIFF}"
    outputs:
      - name: ctx
        extract: stdout

  # ── 2. Triage — pure AI analysis. No worktree, no shell, no edits.
  # Reads /tmp files from ingest, decides ACT vs SKIP based on the
  # comment history holistically + the user's triage policy. Outputs
  # both human-readable reasoning AND a machine-readable marker the
  # downstream `fix` and `reply` nodes parse.
  triage:
    project: "{{input.project}}"
    worktree: false
    depends_on: [ingest]
    prompt: |
      You're triaging a review comment on GitLab MR
      !{{input.mr_iid}}. The new comment from @{{input.reviewer}}
      that triggered this run was:

      ```
      {{input.feedback}}
      ```

      ## Triage policy
      {{input.triage_instructions}}

      (If blank: ACT only on substantive feedback that names a concrete
       defect, missing test, security concern, or specific refactor
       request. SKIP self-comments, system notes, "lgtm" / approvals,
       style nits, comments that just ask questions without proposing
       a fix.)

      ## Context (from the ingest step)
      Parse this KEY=value block:

      ```
      {{nodes.ingest.outputs.ctx}}
      ```

      You get paths to:
        - NOTES_FILE — JSON array of ALL comments (latest at bottom).
          Skip entries where `system: true`.
        - DIFF_FILE  — current MR diff
        - META_FILE  — full MR metadata

      ## Your task
      1. Read NOTES_FILE + DIFF_FILE. Analyze comments **holistically**
         — earlier asks may already be addressed by later code or
         counter-comments; the latest comment is just the trigger.
      2. Write a 1-3 sentence summary of the situation + your
         decision rationale. This will be posted on the MR.
      3. End with EXACTLY one of these lines on its own:
            ACTION: act      (a code fix is warranted)
            ACTION: skip     (no code change needed; explain in summary)

      DO NOT edit files or run git in this step — your only job is
      to decide. The `fix` step is the one that touches code.
    outputs:
      - name: reasoning
        extract: result

  # ── 3. Fix — only does real work when triage said ACT. SKIP path
  # exits in ~1s without touching the worktree. ACT path: align the
  # orchestrator-managed worktree with origin/<source_branch>, make
  # the edits, commit, push HEAD back to the MR's source branch.
  #
  # This step needs a Claude profile with shell access (CLI agent
  # like Claude Code). API-only profiles can't run git here.
  fix:
    project: "{{input.project}}"
    branch: "mr-{{input.mr_iid}}"
    depends_on: [triage]
    prompt: |
      You're the FIX step. The TRIAGE step already decided whether to
      act. Their full reply is:

      ```
      {{nodes.triage.outputs.reasoning}}
      ```

      ## First — check the decision
      If the triage reply ends with `ACTION: skip` (or otherwise doesn't
      end with `ACTION: act`), your job is done immediately:
        - Do NOT touch git, do NOT edit any file.
        - Reply with ONE line literally: `FIX_RESULT: skipped`
        - End.

      If triage ended with `ACTION: act`, continue below.

      ## ACT path — actually fix the code

      ### Context
      Reuse the ingest output:

      ```
      {{nodes.ingest.outputs.ctx}}
      ```

      → SOURCE_BRANCH, NOTES_FILE, DIFF_FILE etc. The orchestrator has
      opened a worktree on branch `mr-{{input.mr_iid}}` at
      `$FORGE_WORKTREE`.

      ### Steps
      1. Align the worktree to origin/<source_branch>:
           cd "$FORGE_WORKTREE"
           git fetch origin "$SOURCE_BRANCH"
           git reset --hard "origin/$SOURCE_BRANCH"
      2. Re-read NOTES_FILE + DIFF_FILE to refresh your context.
      3. Make ONLY the changes the actionable comments call for.
         Stay narrow — don't touch unrelated files.
      4. Commit + push to the MR's source branch:
           git add -A
           git commit -m "fix: address review feedback on !{{input.mr_iid}}"
           git push origin "HEAD:$SOURCE_BRANCH"
      5. Reply with ONE line literally: `FIX_RESULT: pushed`
         (Plus a 1-3 sentence summary of what you changed, above
         that line — it'll be appended to the MR reply by step 4.)

      If git push fails (rejected, auth, network), reply ends with:
        FIX_RESULT: failed
      and include the error message above. The reply step posts an
      error explanation.
    outputs:
      - name: result
        extract: result

  # ── 4. Reply on the MR — post triage reasoning + fix outcome ──
  reply:
    project: "{{input.project}}"
    worktree: false
    depends_on: [fix]
    mode: shell
    prompt: |
      set -e
      PROJECT_ID="{{input.gitlab_project_id}}"
      MR_IID="{{input.mr_iid}}"
      PID_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$PROJECT_ID")
      TRIAGE=$(cat <<'FORGE_T_EOF'
      {{nodes.triage.outputs.reasoning}}
      FORGE_T_EOF
      )
      FIX=$(cat <<'FORGE_F_EOF'
      {{nodes.fix.outputs.result}}
      FORGE_F_EOF
      )
      if echo "$FIX" | grep -Eq '(^|[[:space:]])FIX_RESULT:[[:space:]]*pushed([[:space:]]|$)'; then
        STATUS="pushed"
        BODY="🤖 Forge: 已根据 @{{input.reviewer}} 的反馈推送 fixup commit。

      **Triage:**
      ${TRIAGE}

      **Fix summary:**
      ${FIX}"
      elif echo "$FIX" | grep -Eq '(^|[[:space:]])FIX_RESULT:[[:space:]]*skipped([[:space:]]|$)'; then
        STATUS="skipped"
        BODY="🤖 Forge: 已 review 这条评论,**判断无需修改**。

      ${TRIAGE}"
      elif echo "$FIX" | grep -Eq '(^|[[:space:]])FIX_RESULT:[[:space:]]*failed([[:space:]]|$)'; then
        STATUS="failed"
        BODY="⚠️ Forge: triage 判断需要修复,但应用失败。需人工处理。

      **Triage:**
      ${TRIAGE}

      **Failure:**
      ${FIX}"
      else
        STATUS="unknown"
        BODY="⚠️ Forge: fix 步骤未输出 FIX_RESULT 标记。需人工 review。

      ${FIX}"
      fi
      echo "STATUS=${STATUS}"
      glab api "projects/${PID_ENC}/merge_requests/${MR_IID}/notes" \
        -X POST -f body="$BODY" --jq '.id' \
        && echo "REPLY_POSTED=true" \
        || echo "REPLY_POSTED=false"
    outputs:
      - name: result
        extract: stdout

  # ── 5. Cleanup + Teams notify ──
  # Best-effort: remove the worktree (orchestrator-managed if we got
  # to ACT; never created if SKIP). Ping the comment author on Teams.
  cleanup:
    project: "{{input.project}}"
    worktree: false
    depends_on: [reply]
    mode: shell
    prompt: |
      set +e

      # 1. Notify Teams (best-effort — silent if connector not set up)
      INFO=$'{{nodes.ingest.outputs.ctx}}'
      eval "$(echo "$INFO" | grep -E '^[A-Z_]+=' | sed 's/^/export /')"
      STATUS_OUT=$'{{nodes.reply.outputs.result}}'
      eval "$(echo "$STATUS_OUT" | grep -E '^[A-Z_]+=' | sed 's/^/export /')"

      MSG="🤖 Forge handled MR review comment on \"${MR_TITLE}\" (status: ${STATUS:-?})

      Reviewer: @{{input.reviewer}}
      MR: {{input.mr_url}}"
      PAYLOAD=$(jq -n --arg user "$MR_AUTHOR" --arg msg "$MSG" \
        '{plugin_id:"teams", tool:"send_message", input:{chat_name:$user, message:$msg}}')
      curl -sS -X POST http://127.0.0.1:8403/api/connector-tool \
        -H 'content-type: application/json' --data "$PAYLOAD" \
        > /dev/null 2>&1 \
        && echo "Teams notified @${MR_AUTHOR}" \
        || echo "Teams notify skipped"

      # 2. Remove the worktree (only exists if ACT path ran)
      ROOT=$(git rev-parse --show-toplevel)
      WT="$ROOT/.forge/worktrees/mr-{{input.mr_iid}}"
      if [ -d "$WT" ]; then
        git worktree remove --force "$WT" 2>/dev/null && echo "Removed $WT" || true
      fi
      git worktree prune

      # 3. Remove temp files
      rm -f /tmp/mr-{{input.mr_iid}}-meta.json /tmp/mr-{{input.mr_iid}}-notes.json /tmp/mr-{{input.mr_iid}}-diff.txt

      echo "Cleanup done"
    outputs:
      - name: status
        extract: stdout
