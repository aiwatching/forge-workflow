  cleanup:
    worktree: false
    project: "{{input.project}}"
    prompt: >
      # Best-effort cleanup so the project working tree doesn't pile up

      # one full checkout per fixed bug. Runs only after notify-teams

      # succeeded — if anything upstream failed, the worktree is kept

      # for inspection. The remote branch + MR still live on GitLab.

      set +e

      # Rebuild WORKTREE_DIR from template instead of decoding from upstream
      # — same pattern as fortinet-mr-fix's cleanup. BUG_ID comes from
      # resolve via INFO.

      INFO=$'{{nodes.resolve.outputs.info}}'

      while IFS='=' read -r __k __v; do [[ "$__k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && export "$__k=$__v"; done <<< "$INFO"

      WORKTREE_DIR="{{run.tmp_dir}}/mantis-${BUG_ID}"

      BRANCH=$(git -C "$WORKTREE_DIR" symbolic-ref --short HEAD 2>/dev/null)

      cd "$(git rev-parse --show-toplevel 2>/dev/null || echo .)"

      if [ -d "$WORKTREE_DIR" ]; then
        echo "removing worktree $WORKTREE_DIR …"
        git worktree remove --force "$WORKTREE_DIR" 2>&1 || rm -rf "$WORKTREE_DIR"
        git worktree prune
      else
        echo "no worktree at $WORKTREE_DIR (already cleaned or never created)"
      fi

      # Drop the local branch too — remote copy is on GitLab + the MR.

      [ -n "$BRANCH" ] && git branch -D "$BRANCH" 2>/dev/null && echo "deleted
      local branch $BRANCH"

      echo "cleanup done"
    mode: shell
    depends_on:
      - notify-mantis
    outputs:
      - name: result
        extract: stdout
