name: fortinet-mr-automation-review
description: |
  Automation-test orchestrator for GitLab MRs.

  Find MRs in a Fortinet GitLab project that carry BOTH a stage label
  (default: forge:stage::needs_review) AND a keyword label
  (default: forge:keyword::automation_test). Both label strings are
  pipeline inputs — no hard-coded values.

  For each matching MR (serial, on_failure: continue), run the DAG
  below. Each step is ONE HTTP call / ONE shell action — finer
  granularity = retryable in isolation, easier to debug.

  Setup (runs ONCE before the loop):
    discover-mrs           — glab → MR iids (filter mode OR explicit)

  Per-MR (13 nodes):
    Phase A — Context
      resolve              — glab → SOURCE_BRANCH, MANTIS-<id>
      fetch-mantis         — mantis.get_bug → TEST_PATH

    Phase B — Routing (extension hook)
      route-platform       — emit PLATFORM=tp (default). Currently the
                             only platform is TP; future platforms add
                             their own phase D / E branches and gate
                             them with __SKIP__ here.

    Phase C — Jenkins build (common to all platforms)
      jenkins-trigger      — get_next_build_number (reserve N), then
                             trigger_build with branch param → BUILD_NUMBER
      jenkins-wait-build   — poll get_build(N), tolerating 404 while
                             queued, until building=false → SUCCESS or fail
      jenkins-fetch-artifact — list_artifacts → IMAGE_PATH, NAC_BUILD

    Phase D — NAC upgrade (TP-specific; rename `tp-`/`nac-` for other
              platforms when extending)
      tp-lab-devices       — tp.get_lab_devices → NAC_IP
      nac-upgrade-kick     — nac.upgrade → image written, REBOOTED?
      nac-reboot-if-needed — conditional nac.reboot (else __SKIP__)
      nac-wait-version     — poll get_version → build matches NAC_BUILD

    Phase E — Test execution (TP-specific)
      tp-trigger-test      — tp.run_pytest → EXEC_ID
      tp-wait-result       — poll tp.get_test_execution → terminal

    Phase F — Reporting
      post-to-mr           — glab note + label swap

  Why serial: NAC + lab are shared hardware. Two MRs upgrading the
  same NAC in parallel would race. on_failure=continue so one bad MR
  doesn't kill the rest.

  Two MR-selection modes:
    A. mr_iids non-empty (CSV) → use those
    B. mr_iids empty → glab api with the two label filters

  Adding a new test platform later:
    1. Add a new phase D' / E' branch (e.g. nodes named cyber-*).
    2. Change route-platform to emit PLATFORM=cyber for the relevant
       MRs (based on label / test_path / etc.).
    3. In the TP branch, also gate with PLATFORM check — emit __SKIP__
       when PLATFORM != tp so downstream tp- nodes are skipped.

version: "0.6.2"

for_each:
  source: "{{nodes.discover-mrs.outputs.mr_iids}}"
  as: mr_iid
  on_failure: continue
  before:
    - discover-mrs

input:
  project:
    description: "Local Forge project name (e.g. FortiNAC) — used to locate the git repo (we run glab from inside it to discover host + project path)."
    type: string
    required: true
    label: "Project"

  mr_iids:
    description: "Optional comma-list of MR IIDs (e.g. '14718, 14719'). LEAVE EMPTY to discover via the label filters below."
    type: string
    required: false
    default: ""
    label: "MR IIDs (optional — explicit)"

  label_stage:
    description: "Stage label used to identify MRs awaiting automation test. discover-mrs filters on this AND label_keyword (AND). Default: forge:stage::needs_review"
    type: string
    required: false
    default: "forge:stage::needs_review"
    label: "Stage label filter"

  label_keyword:
    description: "Keyword label used to identify automation-eligible MRs (set by the fortinet-mantis-bug-fix pipeline when the bug's Keywords contains 'QA Automation Test'). Default: forge:keyword::automation_test"
    type: string
    required: false
    default: "forge:keyword::automation_test"
    label: "Keyword label filter"

  # Stage label transitions are HARDCODED (not configurable) — they belong
  # to Forge's reserved state machine namespace `forge:stage::*`:
  #   on PASS → add forge:stage::reviewed,  remove needs_review/needs_fix
  #   on FAIL → add forge:stage::needs_fix, remove needs_review/reviewed
  # Pipeline operators must NOT override these via input.
  #
  # The two fields below are EXTRA tags layered on top — for visibility,
  # dashboards, queries. They MUST NOT use the `forge:stage::` prefix
  # (post-to-mr validates and rejects); use any other namespace, e.g.
  # `forge:test_*`, `qa:*`, `team:*`.

  extra_label_pass:
    description: "Optional extra label added to the MR on test PASS, alongside the hardcoded forge:stage::reviewed transition. MUST NOT start with `forge:stage::` (that namespace is reserved). Leave empty to add nothing extra. Default: forge:test_passed"
    type: string
    required: false
    default: "forge:test_passed"
    label: "Extra label · on PASS (no forge:stage:: prefix)"

  extra_label_fail:
    description: "Optional extra label added to the MR on test FAIL, alongside the hardcoded forge:stage::needs_fix transition. MUST NOT start with `forge:stage::` (that namespace is reserved). Leave empty to add nothing extra. Default: forge:test_failed"
    type: string
    required: false
    default: "forge:test_failed"
    label: "Extra label · on FAIL (no forge:stage:: prefix)"

  max_mrs:
    description: "Cap on number of MRs returned by discover-mrs. Default 10."
    type: number
    required: false
    default: 10
    label: "Max MRs to test"

  jenkins_instance:
    description: "Jenkins instance name (matches a row in the jenkins connector's `instances` settings). Required."
    type: string
    required: true
    label: "Jenkins instance name"

  jenkins_job:
    description: "Jenkins job name (e.g. 'fortinac-build-7.6-token' or nested 'team-x/deploy-app'). The pipeline auto-prefixes `job/` for the URL form, so EITHER 'fortinac-build-7.6-token' OR 'job/fortinac-build-7.6-token' works. Required."
    type: string
    required: true
    label: "Jenkins job path"

  jenkins_branch_param:
    description: "Name of the Jenkins job PARAMETER that takes a branch (e.g. 'BRANCH' or 'SOURCE_BRANCH'). Inspect via jenkins.get_job_params if unsure. This is the parameter NAME, not the value — the value is controlled by jenkins_branch_value below."
    type: string
    required: false
    default: "BRANCH"
    label: "Jenkins branch parameter name"

  jenkins_branch_value:
    description: "Which MR branch to send as the Jenkins build parameter. 'source' = the MR's feature branch (e.g. fix/mantis-1298572) — tests the FIX itself. 'target' = the MR's base branch (e.g. 7.6) — tests the release line (Jenkins jobs that only build release branches need this)."
    type: string
    required: false
    default: "source"
    label: "Jenkins branch value (source / target)"

  jenkins_queue_timeout_sec:
    description: "Max seconds to wait for the Jenkins build to leave the queue (i.e. be assigned an executor). Default 600 (10 min)."
    type: number
    required: false
    default: 600
    label: "Jenkins queue wait timeout (sec)"

  jenkins_build_timeout_sec:
    description: "Max seconds to wait for the Jenkins build itself (after it leaves the queue). Default 3600 (1h)."
    type: number
    required: false
    default: 3600
    label: "Jenkins build timeout (sec)"

  tp_lab:
    description: "TP automation lab name (e.g. AT16_Combined_FSW). The pipeline picks the lab's first NAC for upgrade + uses the same lab for run_pytest. Required for TP platform."
    type: string
    required: true
    label: "TP lab"

  # NAC SSH credentials — three optional pipeline-level overrides for
  # nac.upgrade / nac.reboot / nac.get_version. ALL THREE FALL BACK to
  # the nac connector's saved settings.{username,password,port} when
  # left empty. Resolution order (first non-empty wins):
  #   1. this input (per-run override)
  #   2. (future) TP lab deployinfo user/pass field
  #   3. nac connector's settings.* (the canonical place)
  # Recommended setup: fill all three ONCE in Settings → Connectors → NAC
  # and leave these inputs empty.

  nac_ssh_user:
    description: "Optional SSH username override. Leave empty → use the nac connector's saved 'username' setting. FortiNAC stock = 'admin'."
    type: string
    required: false
    default: ""
    label: "NAC SSH user (override)"

  nac_ssh_password:
    description: "Optional SSH password override. Leave empty → use the nac connector's saved 'password' setting (encrypted at rest, recommended). ⚠️ If you fill this here, it's stored in the pipeline run's state JSON as PLAINTEXT — only use it for non-production NACs or one-off runs."
    type: string
    required: false
    default: ""
    label: "NAC SSH password (override — plaintext on disk)"

  nac_ssh_port:
    description: "Optional SSH port override. Leave empty → use the nac connector's saved 'port' setting (default 22)."
    type: string
    required: false
    default: ""
    label: "NAC SSH port (override)"

  nac_upgrade_timeout_sec:
    description: "Max seconds to wait for the NAC to come back on the target build. Default 1200 (20 min)."
    type: number
    required: false
    default: 1200
    label: "NAC upgrade timeout (sec)"

  test_timeout_sec:
    description: "Max seconds to wait for the pytest exec to reach a terminal state (Done|Failed|Cancelled). Default 7200 (2h)."
    type: number
    required: false
    default: 7200
    label: "Test exec timeout (sec)"

  comment_template:
    description: "MR comment template posted after the test settles. Placeholders: {status} {pass} {fail} {skip} {error} {total} {report_url} {exec_id} {nac_ip} {image_build} {testcase}"
    type: string
    required: false
    multiline: true
    label: "MR comment template"
    default: |
      🤖 Forge automation test result — **{status}**

      Counts: ✅ {pass} / ❌ {fail} / ⚠️ {error} / ⏭ {skip} / total {total}

      - Testcase: `{testcase}`
      - NAC: `{nac_ip}` (upgraded to build {image_build})
      - TP exec id: #{exec_id}
      - Report: {report_url}

      ref: mr-test-{exec_id}

nodes:
  # ════════════════════════════════════════════════════════════════
  # SETUP (runs ONCE before the for_each loop)
  # ════════════════════════════════════════════════════════════════

  # discover-mrs — two modes:
  #   A. input.mr_iids non-empty → use those
  #   B. mr_iids empty → glab api search for MRs with BOTH labels
  # Output `mr_iids` is consumed by for_each.source (CSV). Diagnostic
  # output goes to STDERR only — stdout must be the clean CSV.
  discover-mrs:
    worktree: false
    project: "{{input.project}}"
    mode: shell
    prompt: |
      set -e
      cd "$(git rev-parse --show-toplevel)"
      command -v glab >/dev/null || { echo "ERROR: glab CLI not installed." >&2; exit 1; }
      command -v jq   >/dev/null || { echo "ERROR: jq not installed." >&2; exit 1; }

      RAW=$'{{input.mr_iids}}'
      if [ -n "$RAW" ] && [ "$(echo "$RAW" | tr -d ' \t\r\n')" != "" ]; then
        IIDS=$(echo "$RAW" | tr -d ' \t\r' | tr ',' '\n' | grep -E '^[0-9]+$' | paste -sd, -)
        [ -z "$IIDS" ] && { echo "ERROR: mr_iids='$RAW' has no numeric ids." >&2; exit 1; }
        N=$(echo "$IIDS" | tr ',' '\n' | wc -l | tr -d ' ')
        echo "Mode A (explicit): $N MR IID(s) → $IIDS" >&2
        printf '%s' "$IIDS"
        exit 0
      fi

      LBL_STAGE=$'{{input.label_stage}}'
      LBL_KW=$'{{input.label_keyword}}'
      LIMIT='{{input.max_mrs}}'
      [ -z "$LBL_STAGE" ] && { echo "ERROR: label_stage must be set" >&2; exit 1; }
      [ -z "$LBL_KW" ]    && { echo "ERROR: label_keyword must be set" >&2; exit 1; }

      REMOTE=$(git remote get-url origin)
      PROJECT_PATH=$(echo "$REMOTE" | sed -E 's#^(https?://[^/]+/|git@[^:]+:)##; s#\.git$##')
      [ -z "$PROJECT_PATH" ] && { echo "ERROR: could not derive project path from origin '$REMOTE'" >&2; exit 1; }

      PID_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$PROJECT_PATH")
      LABELS_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(','.join(sys.argv[1:]), safe=''))" "$LBL_STAGE" "$LBL_KW")
      MAX=${LIMIT:-10}

      echo "Mode B (filter): glab api MR labels=$LBL_STAGE,$LBL_KW (cap=$MAX)" >&2
      RESP=$(glab api "projects/${PID_ENC}/merge_requests?state=opened&labels=${LABELS_ENC}&per_page=${MAX}" 2>&1) || {
        echo "ERROR: glab api failed:" >&2; echo "$RESP" | head -20 >&2; exit 1;
      }

      IIDS=$(echo "$RESP" | jq -r '[.[]?.iid // empty] | map(tostring) | unique | join(",")')
      if [ -z "$IIDS" ] || [ "$IIDS" = "null" ]; then
        echo "ERROR: 0 MRs matched labels (state=opened, labels='$LBL_STAGE','$LBL_KW')." >&2
        echo "       Widen the filter, drop a label, or pass mr_iids explicitly." >&2
        exit 1
      fi
      N=$(echo "$IIDS" | tr ',' '\n' | wc -l | tr -d ' ')
      echo "Resolved $N MR IID(s): $IIDS" >&2
      printf '%s' "$IIDS"
    outputs:
      - name: mr_iids
        extract: stdout

  # ════════════════════════════════════════════════════════════════
  # PHASE A — Context (per MR)
  # ════════════════════════════════════════════════════════════════

  # resolve — fetch MR details via glab, extract MANTIS-<id>.
  resolve:
    worktree: false
    project: "{{input.project}}"
    mode: shell
    prompt: |
      set -e
      cd "$(git rev-parse --show-toplevel)"
      MR_IID="{{mr_iid}}"
      [ -z "$MR_IID" ] && { echo "ERROR: mr_iid empty" >&2; exit 1; }

      REMOTE=$(git remote get-url origin)
      HOST=$(echo "$REMOTE" | sed -E 's#^https?://##; s#git@##; s#[:/].*##')
      PROJECT_PATH=$(echo "$REMOTE" | sed -E 's#^(https?://[^/]+/|git@[^:]+:)##; s#\.git$##')
      PID_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$PROJECT_PATH")

      MR_JSON=$(glab api "projects/${PID_ENC}/merge_requests/${MR_IID}" 2>&1) || {
        echo "ERROR: glab api MR #$MR_IID failed:" >&2; echo "$MR_JSON" | head -20 >&2; exit 1;
      }

      SOURCE_BRANCH=$(echo "$MR_JSON" | jq -r '.source_branch // ""')
      TARGET_BRANCH=$(echo "$MR_JSON" | jq -r '.target_branch // ""')
      MR_TITLE=$(echo "$MR_JSON" | jq -r '.title // ""' | tr -d '\n' | head -c 200)
      MR_URL=$(echo "$MR_JSON" | jq -r '.web_url // ""')
      AUTHOR=$(echo "$MR_JSON" | jq -r '.author.username // ""')
      DESCRIPTION=$(echo "$MR_JSON" | jq -r '.description // ""')

      [ -z "$SOURCE_BRANCH" ] && { echo "ERROR: MR #$MR_IID has no source_branch" >&2; exit 1; }

      # MANTIS-<id> from description (fortinet-mantis-bug-fix writes
      # "## Mantis:\nMANTIS-1298572"); fallback to branch name.
      BUG_ID=$(echo "$DESCRIPTION" | grep -oE 'MANTIS-[0-9]+' | head -1 | sed 's/^MANTIS-//')
      [ -z "$BUG_ID" ] && BUG_ID=$(echo "$SOURCE_BRANCH" | grep -oE 'mantis-[0-9]+' | head -1 | sed 's/^mantis-//')
      if [ -z "$BUG_ID" ]; then
        echo "ERROR: no MANTIS-<id> found in MR #$MR_IID description or branch '$SOURCE_BRANCH'." >&2
        exit 1
      fi

      echo "HOST=$HOST"
      echo "PROJECT_PATH=$PROJECT_PATH"
      echo "MR_IID=$MR_IID"
      echo "MR_URL=$MR_URL"
      echo "MR_TITLE=$MR_TITLE"
      echo "SOURCE_BRANCH=$SOURCE_BRANCH"
      echo "TARGET_BRANCH=$TARGET_BRANCH"
      echo "AUTHOR=$AUTHOR"
      echo "BUG_ID=$BUG_ID"
    outputs:
      - name: info
        extract: stdout

  # fetch-mantis — pull the Mantis bug, extract "Automation Test Case:"
  fetch-mantis:
    worktree: false
    project: "{{input.project}}"
    mode: shell
    depends_on:
      - resolve
    prompt: |
      set -e
      INFO=$'{{nodes.resolve.outputs.info}}'
      while IFS='=' read -r __k __v; do [[ "$__k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && export "$__k=$__v"; done <<< "$INFO"
      [ -z "$BUG_ID" ] && { echo "ERROR: BUG_ID empty from resolve" >&2; exit 1; }

      PAYLOAD="{\"plugin_id\":\"mantis\",\"tool\":\"get_bug\",\"input\":{\"bug_id\":$BUG_ID}}"
      RESP=$(curl -sS -X POST http://127.0.0.1:8403/api/connector-tool \
        -H 'content-type: application/json' --data "$PAYLOAD")
      IS_ERR=$(echo "$RESP" | jq -r '.is_error // false')
      if [ "$IS_ERR" = "true" ]; then
        echo "ERROR: mantis.get_bug($BUG_ID) failed: $(echo "$RESP" | jq -r '.content // .error // "(unknown)"' | head -c 400)" >&2
        exit 1
      fi
      BUG=$(echo "$RESP" | jq -c '.content | split("\n\n[watch")[0] | fromjson')
      DESC=$(echo "$BUG" | jq -r '.description // ""')

      # First non-empty line after "Automation Test Case:" heading.
      TEST_PATH=$(echo "$DESC" | awk '
        /^[[:space:]]*Automation[[:space:]]+Test[[:space:]]+Case[[:space:]]*:[[:space:]]*$/ { found=1; next }
        found && /^[[:space:]]*$/ { next }
        found { sub(/^[[:space:]]+/, ""); sub(/[[:space:]]+$/, ""); print; exit }
      ')
      # Fallback: same-line form "Automation Test Case: <path>"
      if [ -z "$TEST_PATH" ]; then
        TEST_PATH=$(echo "$DESC" | sed -nE 's/^[[:space:]]*Automation[[:space:]]+Test[[:space:]]+Case[[:space:]]*:[[:space:]]+(.+)$/\1/p' | head -1 | tr -d '\r' | sed 's/[[:space:]]*$//')
      fi
      if [ -z "$TEST_PATH" ]; then
        echo "ERROR: Mantis bug $BUG_ID has no 'Automation Test Case:' section in description." >&2
        exit 1
      fi
      # TP v2 API joins onto /root/fnac_auto/tests itself — strip prefix.
      TEST_PATH=$(echo "$TEST_PATH" | sed -E 's#^/?tests/##')

      BUG_SUMMARY=$(echo "$BUG" | jq -r '.summary // ""' | tr -d '\n' | head -c 200)
      echo "BUG_ID=$BUG_ID"
      echo "BUG_SUMMARY=$BUG_SUMMARY"
      echo "TEST_PATH=$TEST_PATH"
    outputs:
      - name: details
        extract: stdout

  # ════════════════════════════════════════════════════════════════
  # PHASE B — Routing (extension hook)
  # ════════════════════════════════════════════════════════════════

  # route-platform — decide which test platform handles this MR.
  # CURRENTLY: always TP. Future platforms add their own routing
  # logic here (e.g. inspect TEST_PATH prefix, MR labels, or bug
  # custom fields) and emit PLATFORM=cyber|tp|... Downstream platform-
  # specific nodes gate with PLATFORM != X → __SKIP__.
  route-platform:
    worktree: false
    project: "{{input.project}}"
    mode: shell
    depends_on:
      - fetch-mantis
    prompt: |
      set -e
      D=$'{{nodes.fetch-mantis.outputs.details}}'
      while IFS='=' read -r __k __v; do [[ "$__k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && export "$__k=$__v"; done <<< "$D"

      # Routing logic — extend here when adding a new platform:
      #   case "$TEST_PATH" in
      #     Cyber/*) PLATFORM="cyber" ;;
      #     *)       PLATFORM="tp" ;;
      #   esac
      PLATFORM="tp"

      echo "Routed to platform: $PLATFORM (test=$TEST_PATH)" >&2
      echo "PLATFORM=$PLATFORM"
    outputs:
      - name: route
        extract: stdout

  # ════════════════════════════════════════════════════════════════
  # PHASE C — Jenkins build (common to all platforms)
  # ════════════════════════════════════════════════════════════════

  # jenkins-trigger — reserve next build number, then fire the build.
  # Note: Jenkins's trigger_build returns 201 + `Location:` header + empty
  # body, but Forge's http connector does NOT expose response headers
  # (lib/chat/protocols/http.ts:349-352). So we can't get queue_id from
  # the trigger response. Workaround: read `nextBuildNumber` from the job
  # FIRST (that's the number Jenkins will assign to the next trigger),
  # then trigger, then downstream nodes poll get_build(N) directly.
  # Small race risk if two triggers race on the same job within the same
  # ms — fine for serial for_each + manual fire.
  jenkins-trigger:
    worktree: false
    project: "{{input.project}}"
    mode: shell
    depends_on:
      - route-platform
    prompt: |
      set -e
      I=$'{{nodes.resolve.outputs.info}}'
      while IFS='=' read -r __k __v; do [[ "$__k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && export "$__k=$__v"; done <<< "$I"

      INSTANCE=$'{{input.jenkins_instance}}'
      JOB_RAW=$'{{input.jenkins_job}}'
      BRANCH_PARAM=$'{{input.jenkins_branch_param}}'
      BRANCH_VALUE_KIND=$'{{input.jenkins_branch_value}}'
      BRANCH_VALUE_KIND=${BRANCH_VALUE_KIND:-source}
      [ -z "$INSTANCE" ] && { echo "ERROR: jenkins_instance required" >&2; exit 1; }
      [ -z "$JOB_RAW" ]  && { echo "ERROR: jenkins_job required" >&2; exit 1; }
      [ -z "$SOURCE_BRANCH" ] && { echo "ERROR: SOURCE_BRANCH empty" >&2; exit 1; }

      # Pick which MR branch to send to Jenkins.
      case "$BRANCH_VALUE_KIND" in
        source) BRANCH_VAL="$SOURCE_BRANCH" ;;
        target) BRANCH_VAL="$TARGET_BRANCH"
                [ -z "$BRANCH_VAL" ] && { echo "ERROR: jenkins_branch_value=target but TARGET_BRANCH empty from resolve" >&2; exit 1; }
                ;;
        *) echo "ERROR: jenkins_branch_value must be 'source' or 'target' (got '$BRANCH_VALUE_KIND')" >&2; exit 1 ;;
      esac
      echo "→ jenkins branch param: $BRANCH_PARAM=$BRANCH_VAL (kind=$BRANCH_VALUE_KIND, source=$SOURCE_BRANCH, target=$TARGET_BRANCH)" >&2

      # Normalize jenkins_job → URL form `job/<X>` (or `job/<X>/job/<Y>` for
      # nested). Jenkins URLs always use the `job/` prefix; without it the
      # endpoint returns 404. User may type either form:
      #   "fortinac-build-7.6-token"            → "job/fortinac-build-7.6-token"
      #   "team-x/deploy-app"                   → "job/team-x/job/deploy-app"
      #   "job/fortinac-build-7.6-token"        → verbatim
      JOB_TRIM=$(echo "$JOB_RAW" | sed 's#^/##; s#/$##')
      if echo "$JOB_TRIM" | grep -qE '(^|/)(job|view)/'; then
        JOB="$JOB_TRIM"
      else
        JOB=$(echo "$JOB_TRIM" | awk -F/ '{ for(i=1;i<=NF;i++) printf "%sjob/%s", (i>1?"/":""), $i }')
      fi
      echo "→ normalized jenkins_job: '$JOB_RAW' → '$JOB'" >&2

      # Helper: strip Forge http connector's preamble + truncation notice.
      # `.content` is "HTTP <N> <text> · <METHOD> <url>\n[notice\n]\n<body>"
      # — body starts AFTER the first blank line.
      body_only() { sed '1,/^$/d'; }

      # Step 1: reserve next build number.
      NBN_ARGS=$(jq -nc --arg i "$INSTANCE" --arg j "$JOB" '{instance: $i, job_path: $j}')
      NBN_RESP=$(curl -sS -X POST http://127.0.0.1:8403/api/connector-tool \
        -H 'content-type: application/json' \
        --data "{\"plugin_id\":\"jenkins\",\"tool\":\"get_next_build_number\",\"input\":$NBN_ARGS}")
      NBN_ERR=$(echo "$NBN_RESP" | jq -r '.is_error // false')
      if [ "$NBN_ERR" = "true" ]; then
        echo "ERROR: jenkins.get_next_build_number failed:" >&2
        echo "$NBN_RESP" | jq -r '.content' | head -c 400 >&2
        echo "" >&2
        exit 1
      fi
      NBN_BODY=$(echo "$NBN_RESP" | jq -r '.content' | body_only)
      BUILD_NUMBER=$(echo "$NBN_BODY" | jq -r '.nextBuildNumber // empty')
      if [ -z "$BUILD_NUMBER" ] || [ "$BUILD_NUMBER" = "null" ]; then
        echo "ERROR: could not parse nextBuildNumber. body:" >&2
        echo "$NBN_BODY" | head -c 400 >&2
        echo "" >&2
        exit 1
      fi
      echo "→ reserved build #$BUILD_NUMBER for branch=$SOURCE_BRANCH" >&2

      # Step 2: trigger the build. Don't try to parse the response body
      # (Jenkins returns empty + Location header which Forge strips).
      PARAMS=$(jq -nc --arg k "$BRANCH_PARAM" --arg v "$BRANCH_VAL" '{($k): $v}')
      TRIG_ARGS=$(jq -nc --arg i "$INSTANCE" --arg j "$JOB" --argjson p "$PARAMS" \
        '{instance: $i, job_path: $j, params: $p}')
      TRIG_RESP=$(curl -sS -X POST http://127.0.0.1:8403/api/connector-tool \
        -H 'content-type: application/json' \
        --data "{\"plugin_id\":\"jenkins\",\"tool\":\"trigger_build\",\"input\":$TRIG_ARGS}")
      TRIG_ERR=$(echo "$TRIG_RESP" | jq -r '.is_error // false')
      if [ "$TRIG_ERR" = "true" ]; then
        echo "ERROR: jenkins.trigger_build failed:" >&2
        echo "$TRIG_RESP" | jq -r '.content' | head -c 400 >&2
        echo "" >&2
        exit 1
      fi
      echo "→ triggered (build #$BUILD_NUMBER pending in queue / executing)" >&2

      echo "JENKINS_INSTANCE=$INSTANCE"
      echo "JENKINS_JOB=$JOB"
      echo "BUILD_NUMBER=$BUILD_NUMBER"
    outputs:
      - name: trigger
        extract: stdout

  # jenkins-wait-build — poll get_build(N) until building=false; check SUCCESS.
  # The build may not exist immediately after trigger (it's queued first);
  # get_build returns 404 (is_error=true) in that window — keep polling.
  jenkins-wait-build:
    worktree: false
    project: "{{input.project}}"
    mode: shell
    depends_on:
      - jenkins-trigger
    prompt: |
      set -e
      T=$'{{nodes.jenkins-trigger.outputs.trigger}}'
      while IFS='=' read -r __k __v; do [[ "$__k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && export "$__k=$__v"; done <<< "$T"

      Q_TIMEOUT='{{input.jenkins_queue_timeout_sec}}'; Q_TIMEOUT=${Q_TIMEOUT:-600}
      B_TIMEOUT='{{input.jenkins_build_timeout_sec}}'; B_TIMEOUT=${B_TIMEOUT:-3600}
      TOTAL_TIMEOUT=$(( Q_TIMEOUT + B_TIMEOUT ))
      START=$(date +%s)

      body_only() { sed '1,/^$/d'; }

      B_ARGS=$(jq -nc --arg i "$JENKINS_INSTANCE" --arg j "$JENKINS_JOB" --argjson n "$BUILD_NUMBER" \
        '{instance: $i, job_path: $j, build_number: $n}')
      echo "→ polling get_build #$BUILD_NUMBER (timeout ${TOTAL_TIMEOUT}s)" >&2

      RESULT=""
      while :; do
        ELAPSED=$(( $(date +%s) - START ))
        [ "$ELAPSED" -gt "$TOTAL_TIMEOUT" ] && {
          echo "ERROR: build #$BUILD_NUMBER did not finish within ${TOTAL_TIMEOUT}s." >&2
          exit 1
        }
        B=$(curl -sS -X POST http://127.0.0.1:8403/api/connector-tool \
          -H 'content-type: application/json' \
          --data "{\"plugin_id\":\"jenkins\",\"tool\":\"get_build\",\"input\":$B_ARGS}")
        IS_ERR=$(echo "$B" | jq -r '.is_error // false')
        if [ "$IS_ERR" = "true" ]; then
          # Early window: build still queued → get_build 404. Keep polling.
          echo "   [${ELAPSED}s] build #$BUILD_NUMBER not yet visible (queued?)" >&2
          sleep 15
          continue
        fi
        BODY=$(echo "$B" | jq -r '.content' | body_only)
        BUILDING=$(echo "$BODY" | jq -r '.building // false')
        RESULT=$(echo "$BODY" | jq -r '.result // ""')
        if [ "$BUILDING" = "false" ]; then
          echo "   build #$BUILD_NUMBER finished after ${ELAPSED}s: result=$RESULT" >&2
          if [ "$RESULT" != "SUCCESS" ]; then
            echo "ERROR: Jenkins build #$BUILD_NUMBER result=$RESULT" >&2
            exit 1
          fi
          break
        fi
        echo "   [${ELAPSED}s] build #$BUILD_NUMBER still running…" >&2
        sleep 30
      done

      echo "JENKINS_INSTANCE=$JENKINS_INSTANCE"
      echo "JENKINS_JOB=$JENKINS_JOB"
      echo "BUILD_NUMBER=$BUILD_NUMBER"
      echo "BUILD_RESULT=$RESULT"
      echo "BUILD_WAIT_SEC=$ELAPSED"
    outputs:
      - name: build
        extract: stdout

  # jenkins-fetch-artifact — find .out, derive IMAGE_PATH + NAC_BUILD.
  jenkins-fetch-artifact:
    worktree: false
    project: "{{input.project}}"
    mode: shell
    depends_on:
      - jenkins-wait-build
    prompt: |
      set -e
      B=$'{{nodes.jenkins-wait-build.outputs.build}}'
      while IFS='=' read -r __k __v; do [[ "$__k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && export "$__k=$__v"; done <<< "$B"

      body_only() { sed '1,/^$/d'; }

      LA_ARGS=$(jq -nc --arg i "$JENKINS_INSTANCE" --arg j "$JENKINS_JOB" --argjson n "$BUILD_NUMBER" '{instance: $i, job_path: $j, build_number: $n}')
      LA=$(curl -sS -X POST http://127.0.0.1:8403/api/connector-tool \
        -H 'content-type: application/json' \
        --data "{\"plugin_id\":\"jenkins\",\"tool\":\"list_artifacts\",\"input\":$LA_ARGS}")
      IS_ERR=$(echo "$LA" | jq -r '.is_error // false')
      if [ "$IS_ERR" = "true" ]; then
        echo "ERROR: jenkins.list_artifacts failed: $(echo "$LA" | jq -r '.content // .error' | head -c 400)" >&2
        exit 1
      fi
      BODY=$(echo "$LA" | jq -r '.content' | body_only)
      OUT_REL=$(echo "$BODY" | jq -r '.artifacts[]?.relativePath' | grep -E '\.out$' | head -1)
      if [ -z "$OUT_REL" ]; then
        echo "ERROR: no .out artifact in build #$BUILD_NUMBER. Available:" >&2
        echo "$BODY" | jq -r '.artifacts[]?.relativePath' | head -10 >&2
        exit 1
      fi
      NAC_BUILD=$(echo "$OUT_REL" | grep -oE 'build[0-9]+' | head -1 | sed 's/^build//')
      [ -z "$NAC_BUILD" ] && { echo "ERROR: could not parse NAC build number from filename '$OUT_REL'" >&2; exit 1; }

      # JENKINS_JOB is in URL form (e.g. job/X or job/X/job/Y after
      # jenkins-trigger's normalization). Jenkins filesystem layout uses
      # `jobs/` between segments instead of URL's `job/`, so translate:
      #   "job/fortinac-build-7.6-token"  →  "fortinac-build-7.6-token"
      #   "job/team/job/sub"              →  "team/jobs/sub"
      JOB_FS=$(echo "$JENKINS_JOB" | sed -E 's#^job/##; s#/job/#/jobs/#g')
      IMAGE_PATH="/var/lib/jenkins/jobs/${JOB_FS}/builds/${BUILD_NUMBER}/archive/${OUT_REL}"

      echo "OUT_REL=$OUT_REL"
      echo "IMAGE_PATH=$IMAGE_PATH"
      echo "NAC_BUILD=$NAC_BUILD"
      echo "BUILD_NUMBER=$BUILD_NUMBER"
    outputs:
      - name: artifact
        extract: stdout

  # ════════════════════════════════════════════════════════════════
  # PHASE D — TP-specific NAC upgrade
  # All `tp-` / `nac-` nodes below gate with PLATFORM != tp → __SKIP__.
  # ════════════════════════════════════════════════════════════════

  # tp-lab-devices — pick NAC IP from the lab.
  tp-lab-devices:
    worktree: false
    project: "{{input.project}}"
    mode: shell
    depends_on:
      - route-platform
    prompt: |
      set -e
      R=$'{{nodes.route-platform.outputs.route}}'
      while IFS='=' read -r __k __v; do [[ "$__k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && export "$__k=$__v"; done <<< "$R"
      if [ "$PLATFORM" != "tp" ]; then echo "Platform=$PLATFORM, not tp — skipping" >&2; echo "__SKIP__"; exit 0; fi

      LAB=$'{{input.tp_lab}}'
      [ -z "$LAB" ] && { echo "ERROR: tp_lab required" >&2; exit 1; }

      PAYLOAD=$(jq -nc --arg lab "$LAB" '{plugin_id:"tp",tool:"get_lab_devices",input:{lab:$lab}}')
      RESP=$(curl -sS -X POST http://127.0.0.1:8403/api/connector-tool \
        -H 'content-type: application/json' --data "$PAYLOAD")
      IS_ERR=$(echo "$RESP" | jq -r '.is_error // false')
      if [ "$IS_ERR" = "true" ]; then
        echo "ERROR: tp.get_lab_devices($LAB) failed: $(echo "$RESP" | jq -r '.content // .error' | head -c 400)" >&2
        exit 1
      fi
      BODY=$(echo "$RESP" | jq -c '.content | split("\n\n[watch")[0] | fromjson')
      NAC_IP=$(echo "$BODY" | jq -r '.nac_devices[0]?.ip // empty')
      if [ -z "$NAC_IP" ] || [ "$NAC_IP" = "null" ]; then
        echo "ERROR: lab '$LAB' has no NAC device with an IP." >&2
        echo "       body: $(echo "$BODY" | jq -c '. | {lab, status, nac_devices}')" >&2
        exit 1
      fi
      echo "TP_LAB=$LAB"
      echo "NAC_IP=$NAC_IP"
    outputs:
      - name: lab
        extract: stdout

  # nac-upgrade-kick — fire nac.upgrade, capture rebooted flag.
  nac-upgrade-kick:
    worktree: false
    project: "{{input.project}}"
    mode: shell
    depends_on:
      - jenkins-fetch-artifact
      - tp-lab-devices
    prompt: |
      set -e
      R=$'{{nodes.route-platform.outputs.route}}'
      while IFS='=' read -r __k __v; do [[ "$__k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && export "$__k=$__v"; done <<< "$R"
      if [ "$PLATFORM" != "tp" ]; then echo "Platform=$PLATFORM — skipping" >&2; echo "__SKIP__"; exit 0; fi

      A=$'{{nodes.jenkins-fetch-artifact.outputs.artifact}}'
      while IFS='=' read -r __k __v; do [[ "$__k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && export "$__k=$__v"; done <<< "$A"
      L=$'{{nodes.tp-lab-devices.outputs.lab}}'
      while IFS='=' read -r __k __v; do [[ "$__k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && export "$__k=$__v"; done <<< "$L"

      [ -z "$NAC_IP" ]     && { echo "ERROR: NAC_IP empty" >&2; exit 1; }
      [ -z "$IMAGE_PATH" ] && { echo "ERROR: IMAGE_PATH empty" >&2; exit 1; }

      # All three of user/password/port are OPTIONAL overrides — only
      # include the ones the user actually filled (non-empty). The nac
      # connector's saved settings fill the rest.
      NAC_USER=$'{{input.nac_ssh_user}}'
      NAC_PASS=$'{{input.nac_ssh_password}}'
      NAC_PORT=$'{{input.nac_ssh_port}}'
      UP_ARGS=$(jq -nc --arg h "$NAC_IP" --arg ip "$IMAGE_PATH" \
        --arg u "$NAC_USER" --arg p "$NAC_PASS" --arg pt "$NAC_PORT" \
        '{host: $h, image_path: $ip}
         | (if $u  != "" then .username = $u  else . end)
         | (if $p  != "" then .password = $p  else . end)
         | (if $pt != "" then .port     = $pt else . end)')
      echo "→ nac.upgrade host=$NAC_IP user=${NAC_USER:-<connector>} pass=$([ -n "$NAC_PASS" ] && echo override || echo '<connector>') port=${NAC_PORT:-<connector>} image=$IMAGE_PATH" >&2
      RESP=$(curl -sS -X POST http://127.0.0.1:8403/api/connector-tool \
        -H 'content-type: application/json' \
        --data "{\"plugin_id\":\"nac\",\"tool\":\"upgrade\",\"input\":$UP_ARGS}")
      IS_ERR=$(echo "$RESP" | jq -r '.is_error // false')
      if [ "$IS_ERR" = "true" ]; then
        echo "ERROR: nac.upgrade failed: $(echo "$RESP" | jq -r '.content // .error' | head -c 400)" >&2
        exit 1
      fi
      BODY=$(echo "$RESP" | jq -c '.content | split("\n\n[watch")[0] | fromjson')
      REBOOTED=$(echo "$BODY" | jq -r '.captured.rebooted // empty')
      TARGET_BUILD=$(echo "$BODY" | jq -r '.captured.target_build // empty')
      [ -z "$TARGET_BUILD" ] && TARGET_BUILD="$NAC_BUILD"

      echo "NAC_IP=$NAC_IP"
      echo "TARGET_BUILD=$TARGET_BUILD"
      echo "REBOOTED=${REBOOTED:-no}"
    outputs:
      - name: upgrade
        extract: stdout

  # nac-reboot-if-needed — conditional reboot.
  # Emits __SKIP__ when REBOOTED non-empty (no reboot needed).
  nac-reboot-if-needed:
    worktree: false
    project: "{{input.project}}"
    mode: shell
    depends_on:
      - nac-upgrade-kick
    prompt: |
      set -e
      R=$'{{nodes.route-platform.outputs.route}}'
      while IFS='=' read -r __k __v; do [[ "$__k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && export "$__k=$__v"; done <<< "$R"
      if [ "$PLATFORM" != "tp" ]; then echo "Platform=$PLATFORM — skipping" >&2; echo "__SKIP__"; exit 0; fi

      U=$'{{nodes.nac-upgrade-kick.outputs.upgrade}}'
      while IFS='=' read -r __k __v; do [[ "$__k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && export "$__k=$__v"; done <<< "$U"

      if [ "$REBOOTED" != "no" ] && [ -n "$REBOOTED" ]; then
        echo "NAC auto-rebooted (REBOOTED=$REBOOTED) — no manual reboot needed" >&2
        echo "__SKIP__"
        exit 0
      fi

      NAC_USER=$'{{input.nac_ssh_user}}'
      NAC_PASS=$'{{input.nac_ssh_password}}'
      NAC_PORT=$'{{input.nac_ssh_port}}'
      echo "→ NAC did NOT auto-reboot; firing nac.reboot $NAC_IP user=${NAC_USER:-<connector>} pass=$([ -n "$NAC_PASS" ] && echo override || echo '<connector>') port=${NAC_PORT:-<connector>}" >&2
      RB_ARGS=$(jq -nc --arg h "$NAC_IP" \
        --arg u "$NAC_USER" --arg p "$NAC_PASS" --arg pt "$NAC_PORT" \
        '{host: $h}
         | (if $u  != "" then .username = $u  else . end)
         | (if $p  != "" then .password = $p  else . end)
         | (if $pt != "" then .port     = $pt else . end)')
      RB=$(curl -sS -X POST http://127.0.0.1:8403/api/connector-tool \
        -H 'content-type: application/json' \
        --data "{\"plugin_id\":\"nac\",\"tool\":\"reboot\",\"input\":$RB_ARGS}")
      IS_ERR=$(echo "$RB" | jq -r '.is_error // false')
      [ "$IS_ERR" = "true" ] && echo "WARN: nac.reboot returned error: $(echo "$RB" | jq -r '.content' | head -c 300)" >&2
      echo "REBOOT_SENT=yes"
    outputs:
      - name: reboot
        extract: stdout

  # nac-wait-version — poll get_version until build matches NAC_BUILD.
  nac-wait-version:
    worktree: false
    project: "{{input.project}}"
    mode: shell
    depends_on:
      - nac-upgrade-kick
      - nac-reboot-if-needed
    prompt: |
      set -e
      R=$'{{nodes.route-platform.outputs.route}}'
      while IFS='=' read -r __k __v; do [[ "$__k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && export "$__k=$__v"; done <<< "$R"
      if [ "$PLATFORM" != "tp" ]; then echo "Platform=$PLATFORM — skipping" >&2; echo "__SKIP__"; exit 0; fi

      U=$'{{nodes.nac-upgrade-kick.outputs.upgrade}}'
      while IFS='=' read -r __k __v; do [[ "$__k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && export "$__k=$__v"; done <<< "$U"

      TIMEOUT='{{input.nac_upgrade_timeout_sec}}'
      TIMEOUT=${TIMEOUT:-1200}
      START=$(date +%s)

      NAC_USER=$'{{input.nac_ssh_user}}'
      NAC_PASS=$'{{input.nac_ssh_password}}'
      NAC_PORT=$'{{input.nac_ssh_port}}'
      GV_ARGS=$(jq -nc --arg h "$NAC_IP" \
        --arg u "$NAC_USER" --arg p "$NAC_PASS" --arg pt "$NAC_PORT" \
        '{host: $h}
         | (if $u  != "" then .username = $u  else . end)
         | (if $p  != "" then .password = $p  else . end)
         | (if $pt != "" then .port     = $pt else . end)')
      echo "→ polling nac.get_version $NAC_IP user=${NAC_USER:-<connector>} pass=$([ -n "$NAC_PASS" ] && echo override || echo '<connector>') port=${NAC_PORT:-<connector>} for build $TARGET_BUILD (timeout ${TIMEOUT}s)" >&2

      while :; do
        ELAPSED=$(( $(date +%s) - START ))
        [ "$ELAPSED" -gt "$TIMEOUT" ] && {
          echo "ERROR: NAC $NAC_IP did not reach build $TARGET_BUILD within ${TIMEOUT}s." >&2
          exit 1
        }
        GV=$(curl -sS -X POST http://127.0.0.1:8403/api/connector-tool \
          -H 'content-type: application/json' \
          --data "{\"plugin_id\":\"nac\",\"tool\":\"get_version\",\"input\":$GV_ARGS}" 2>/dev/null || true)
        GV_ERR=$(echo "$GV" | jq -r '.is_error // false')
        if [ "$GV_ERR" = "true" ]; then
          echo "   [${ELAPSED}s] NAC unreachable (rebooting?)" >&2
        else
          CUR_BUILD=$(echo "$GV" | jq -r '.content | split("\n\n[watch")[0] | fromjson | .captured.build // empty')
          echo "   [${ELAPSED}s] current build=$CUR_BUILD (target=$TARGET_BUILD)" >&2
          if [ "$CUR_BUILD" = "$TARGET_BUILD" ]; then
            echo "NAC $NAC_IP now on build $TARGET_BUILD (took ${ELAPSED}s)" >&2
            break
          fi
        fi
        sleep 30
      done

      echo "NAC_IP=$NAC_IP"
      echo "TARGET_BUILD=$TARGET_BUILD"
      echo "UPGRADE_ELAPSED_SEC=$ELAPSED"
    outputs:
      - name: ready
        extract: stdout

  # ════════════════════════════════════════════════════════════════
  # PHASE E — TP-specific test execution
  # ════════════════════════════════════════════════════════════════

  # tp-trigger-test — fire tp.run_pytest, return EXEC_ID.
  tp-trigger-test:
    worktree: false
    project: "{{input.project}}"
    mode: shell
    depends_on:
      - fetch-mantis
      - nac-wait-version
    prompt: |
      set -e
      R=$'{{nodes.route-platform.outputs.route}}'
      while IFS='=' read -r __k __v; do [[ "$__k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && export "$__k=$__v"; done <<< "$R"
      if [ "$PLATFORM" != "tp" ]; then echo "Platform=$PLATFORM — skipping" >&2; echo "__SKIP__"; exit 0; fi

      D=$'{{nodes.fetch-mantis.outputs.details}}'
      while IFS='=' read -r __k __v; do [[ "$__k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && export "$__k=$__v"; done <<< "$D"

      LAB=$'{{input.tp_lab}}'
      [ -z "$TEST_PATH" ] && { echo "ERROR: TEST_PATH empty" >&2; exit 1; }
      [ -z "$LAB" ]       && { echo "ERROR: tp_lab required" >&2; exit 1; }

      RUN_ARGS=$(jq -nc --arg lab "$LAB" --arg t "$TEST_PATH" \
        '{lab: $lab, testcase: [$t], argument: "-vv --tb=short"}')
      echo "→ tp.run_pytest lab=$LAB testcase=$TEST_PATH" >&2

      RESP=$(curl -sS -X POST http://127.0.0.1:8403/api/connector-tool \
        -H 'content-type: application/json' \
        --data "{\"plugin_id\":\"tp\",\"tool\":\"run_pytest\",\"input\":$RUN_ARGS}")
      IS_ERR=$(echo "$RESP" | jq -r '.is_error // false')
      if [ "$IS_ERR" = "true" ]; then
        echo "ERROR: tp.run_pytest failed: $(echo "$RESP" | jq -r '.content // .error' | head -c 400)" >&2
        exit 1
      fi
      BODY=$(echo "$RESP" | jq -c '.content | split("\n\n[watch")[0] | fromjson')
      EXEC_ID=$(echo "$BODY" | jq -r '.exec_id // empty')
      [ -z "$EXEC_ID" ] || [ "$EXEC_ID" = "null" ] && { echo "ERROR: no exec_id in response: $BODY" >&2; exit 1; }

      echo "EXEC_ID=$EXEC_ID"
      echo "TESTCASE=$TEST_PATH"
      echo "TP_LAB=$LAB"
    outputs:
      - name: trigger
        extract: stdout

  # tp-wait-result — poll get_test_execution until terminal.
  tp-wait-result:
    worktree: false
    project: "{{input.project}}"
    mode: shell
    depends_on:
      - tp-trigger-test
    prompt: |
      set -e
      R=$'{{nodes.route-platform.outputs.route}}'
      while IFS='=' read -r __k __v; do [[ "$__k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && export "$__k=$__v"; done <<< "$R"
      if [ "$PLATFORM" != "tp" ]; then echo "Platform=$PLATFORM — skipping" >&2; echo "__SKIP__"; exit 0; fi

      T=$'{{nodes.tp-trigger-test.outputs.trigger}}'
      while IFS='=' read -r __k __v; do [[ "$__k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && export "$__k=$__v"; done <<< "$T"

      TIMEOUT='{{input.test_timeout_sec}}'
      TIMEOUT=${TIMEOUT:-7200}
      START=$(date +%s)

      while :; do
        ELAPSED=$(( $(date +%s) - START ))
        [ "$ELAPSED" -gt "$TIMEOUT" ] && {
          echo "ERROR: TP exec #$EXEC_ID did not reach terminal status within ${TIMEOUT}s." >&2
          exit 1
        }
        GE=$(curl -sS -X POST http://127.0.0.1:8403/api/connector-tool \
          -H 'content-type: application/json' \
          --data "{\"plugin_id\":\"tp\",\"tool\":\"get_test_execution\",\"input\":{\"id\":$EXEC_ID}}")
        GE_ERR=$(echo "$GE" | jq -r '.is_error // false')
        if [ "$GE_ERR" = "true" ]; then
          echo "   [${ELAPSED}s] get_test_execution error: $(echo "$GE" | jq -r '.content' | head -c 200)" >&2
          sleep 30
          continue
        fi
        E=$(echo "$GE" | jq -c '.content | split("\n\n[watch")[0] | fromjson')
        STATUS=$(echo "$E" | jq -r '.status // ""')
        PASS=$(echo "$E"   | jq -r '.pass_count   // 0')
        FAIL=$(echo "$E"   | jq -r '.fail_count   // 0')
        ERR_C=$(echo "$E"  | jq -r '.error_count  // 0')
        SKIP=$(echo "$E"   | jq -r '.skip_count   // 0')
        TOTAL=$(echo "$E"  | jq -r '.total_count  // 0')
        REPORT=$(echo "$E" | jq -r '.report_url // .report_file_path // ""')
        echo "   [${ELAPSED}s] status=$STATUS  P$PASS/F$FAIL/E$ERR_C/S$SKIP of $TOTAL" >&2
        case "$STATUS" in
          Done|Failed|Cancelled) break ;;
          Initiating|Running) sleep 30 ;;
          *) echo "WARN: unknown TP status '$STATUS' — treating as terminal" >&2; break ;;
        esac
      done

      FINAL="pass"
      if [ "$STATUS" != "Done" ]; then FINAL="fail"
      elif [ "$FAIL" -gt 0 ] || [ "$ERR_C" -gt 0 ]; then FINAL="fail"; fi

      echo "EXEC_ID=$EXEC_ID"
      echo "STATUS=$STATUS"
      echo "PASS=$PASS"
      echo "FAIL=$FAIL"
      echo "SKIP=$SKIP"
      echo "ERR_C=$ERR_C"
      echo "TOTAL=$TOTAL"
      echo "REPORT_URL=$REPORT"
      echo "FINAL=$FINAL"
      echo "TESTCASE=$TESTCASE"
    outputs:
      - name: result
        extract: stdout

  # ════════════════════════════════════════════════════════════════
  # PHASE F — Reporting
  # ════════════════════════════════════════════════════════════════

  # post-to-mr — comment + label swap.
  post-to-mr:
    worktree: false
    project: "{{input.project}}"
    mode: shell
    depends_on:
      - tp-wait-result
    prompt: |
      set -e
      I=$'{{nodes.resolve.outputs.info}}'
      while IFS='=' read -r __k __v; do [[ "$__k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && export "$__k=$__v"; done <<< "$I"
      W=$'{{nodes.tp-wait-result.outputs.result}}'
      while IFS='=' read -r __k __v; do [[ "$__k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && export "$__k=$__v"; done <<< "$W"
      U=$'{{nodes.nac-upgrade-kick.outputs.upgrade}}'
      while IFS='=' read -r __k __v; do [[ "$__k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && export "$__k=$__v"; done <<< "$U"

      EXTRA_PASS=$'{{input.extra_label_pass}}'
      EXTRA_FAIL=$'{{input.extra_label_fail}}'
      TPL=$'{{input.comment_template}}'

      # Forge-owned stage transitions — HARDCODED, not user-overridable.
      # forge:stage::* is the reserved namespace for the state machine.
      STAGE_PASS="forge:stage::reviewed"
      STAGE_FAIL="forge:stage::needs_fix"
      STAGE_FILTER="forge:stage::needs_review"   # the discover-mrs trigger

      # Validate: extra labels MUST NOT use forge:stage:: prefix (reserved).
      for L in "$EXTRA_PASS" "$EXTRA_FAIL"; do
        if [ -n "$L" ] && echo "$L" | grep -qE '^forge:stage::'; then
          echo "ERROR: extra labels must not start with 'forge:stage::' (reserved namespace). Got: '$L'" >&2
          echo "       Use any other namespace, e.g. 'forge:test_passed', 'qa:smoke_ok'." >&2
          exit 1
        fi
      done

      [ -z "$MR_IID" ]       && { echo "ERROR: MR_IID missing" >&2; exit 1; }
      [ -z "$PROJECT_PATH" ] && { echo "ERROR: PROJECT_PATH missing" >&2; exit 1; }

      PID_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$PROJECT_PATH")

      COMMENT=$(python3 - "$TPL" "$STATUS" "$PASS" "$FAIL" "$SKIP" "$ERR_C" "$TOTAL" "$REPORT_URL" "$EXEC_ID" "$NAC_IP" "$TARGET_BUILD" "$TESTCASE" <<'PY'
      import sys
      tpl,status,p,f,s,e,total,report,exec_id,nac_ip,img_build,testcase = sys.argv[1:13]
      print(tpl
        .replace('{status}', status)
        .replace('{pass}',  p)
        .replace('{fail}',  f)
        .replace('{skip}',  s)
        .replace('{error}', e)
        .replace('{total}', total)
        .replace('{report_url}', report or '(no report)')
        .replace('{exec_id}', exec_id)
        .replace('{nac_ip}', nac_ip)
        .replace('{image_build}', img_build)
        .replace('{testcase}', testcase))
      PY
      )

      NOTE_PAYLOAD=$(jq -nc --arg b "$COMMENT" '{body: $b}')
      NOTE_RESP=$(glab api "projects/${PID_ENC}/merge_requests/${MR_IID}/notes" -X POST \
        --input - <<<"$NOTE_PAYLOAD" 2>&1) || {
        echo "WARN: glab post-note failed:" >&2; echo "$NOTE_RESP" | head -20 >&2;
      }

      # Build add/remove label lists. Forge-owned stage transitions are
      # always written; extras are added (or removed when opposite outcome).
      if [ "$FINAL" = "pass" ]; then
        ADD_LIST="$STAGE_PASS"
        REMOVE_LIST="$STAGE_FILTER,$STAGE_FAIL"
        [ -n "$EXTRA_PASS" ] && ADD_LIST="$ADD_LIST,$EXTRA_PASS"
        [ -n "$EXTRA_FAIL" ] && REMOVE_LIST="$REMOVE_LIST,$EXTRA_FAIL"
      else
        ADD_LIST="$STAGE_FAIL"
        REMOVE_LIST="$STAGE_FILTER,$STAGE_PASS"
        [ -n "$EXTRA_FAIL" ] && ADD_LIST="$ADD_LIST,$EXTRA_FAIL"
        [ -n "$EXTRA_PASS" ] && REMOVE_LIST="$REMOVE_LIST,$EXTRA_PASS"
      fi

      if glab api "projects/${PID_ENC}/merge_requests/${MR_IID}" -X PUT \
           -f "add_labels=$ADD_LIST" \
           -f "remove_labels=$REMOVE_LIST" \
           > /dev/null 2>&1; then
        echo "Posted comment + labels: +[$ADD_LIST] -[$REMOVE_LIST]" >&2
      else
        echo "WARN: failed to swap labels (+[$ADD_LIST] / -[$REMOVE_LIST])" >&2
      fi

      echo "MR_IID=$MR_IID"
      echo "FINAL=$FINAL"
      echo "ADDED_LABELS=$ADD_LIST"
      echo "REMOVED_LABELS=$REMOVE_LIST"
    outputs:
      - name: posted
        extract: stdout
