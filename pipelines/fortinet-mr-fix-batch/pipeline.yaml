name: fortinet-mr-fix-batch
description: |
  Batch Fortinet GitLab MR review responder. Two input modes, EITHER:
    (a) provide `mr_iids` directly (comma-separated), OR
    (b) leave `mr_iids` empty and provide a filter (`author`/`labels`/
        `limit`) — the `list-iids` setup node calls glab and resolves
        the iid set at run time.
  The framework's `for_each:` then loops the full 5-node single-MR
  flow (ingest → triage → fix → reply → cleanup) once per iid.

  All step output is visible in the same pipeline run — no child
  pipelines, no HTTP roundtrips. Iteration history persists in
  `pipeline.forEach.iterations[]`; UI renders per-iter snapshots
  above the current-iter DAG. The `list-iids` setup node runs ONCE
  before the loop and stays `done` across iterations (visible at the
  top of the DAG, not inside any iteration card).

  on_failure: continue (default) — one MR failing doesn't stop the
  rest. Final pipeline status = failed iff any iter failed.

  Fortinet-specific assumptions:
    - glab CLI authenticated to the Fortinet GitLab host
    - jq + python3 installed
    - claude-code (CLI Claude) available for the fix step
    - the project lives under projectRoots (so worktrees can be
      opened on its repo)
    - all MRs in the batch live in the same gitlab_project_id (cross-
      project batches need to be split into separate Fire's)

version: "0.4.1"

for_each:
  source: "{{nodes.list-iids.outputs.iids}}"
  as: mr_iid
  on_failure: continue
  before: [list-iids]

input:
  project:
    description: "Local Forge project name (e.g. FortiNAC)"
    type: string
    required: true
    label: "Project"
  gitlab_project_id:
    description: "GitLab project — namespace/repo (e.g. fortinac/FortiNAC) or numeric id"
    type: string
    required: true
    label: "GitLab project id"
  mr_iids:
    description: "[Mode A] Comma-separated GitLab MR iids (e.g. '8421, 8422'). Leave EMPTY to use the filter inputs below instead."
    type: string
    required: false
    label: "MR iids (explicit)"
  author:
    description: "[Mode B filter] MR author username. '@me' resolves via `glab api user`. Ignored when mr_iids is set."
    type: string
    required: false
    label: "Author filter"
  labels:
    description: "[Mode B filter] Comma-separated label names (AND'd). Ignored when mr_iids is set."
    type: string
    required: false
    label: "Labels filter"
  limit:
    description: "[Mode B filter] Max MRs to fetch when using the filter. Default 20. Ignored when mr_iids is set."
    type: string
    required: false
    default: "20"
    label: "Limit"
  user_prompt:
    description: "Triage policy — when to act / skip / close / noop"
    type: string
    multiline: true
    label: "Triage policy"
    default: |
      ACT on any concrete code change request from a human reviewer
      (missing cleanup, refactor with clear rationale, bug, missing
      test, security concern) AND on 'error' findings from code
      review bots.

      SKIP approvals / lgtm / style-nits / questions / bot warnings
      about MR metadata.

      NOOP (do nothing, post no reply) when the latest non-system
      comment was authored by Forge itself (body starts with
      '🤖 Forge:') OR by the same GitLab user this Job runs as.
      Nothing has changed since the last Forge run.

      CLOSE only when reviewers explicitly call for abandonment
      (duplicate MR, wrong approach, work superseded). Be
      conservative — when in doubt, skip, never close.

nodes:
  # ── 0. list-iids (setup phase) — resolve the iid set ──
  #
  # Runs ONCE before the loop body (for_each.before: [list-iids]).
  # Mode A: input.mr_iids is set → echo it verbatim, ignore the filter.
  # Mode B: input.mr_iids is empty → call glab to filter open MRs by
  #         author + labels + limit.
  # Output `iids` is a CSV string consumed by for_each.source.
  # All diagnostics go to stderr so stdout = pure CSV for the framework.
  list-iids:
    project: "{{input.project}}"
    worktree: false
    mode: shell
    prompt: |
      set -e
      PROJECT_ID="{{input.gitlab_project_id}}"
      PID_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$PROJECT_ID")

      # Pre-trim explicit-iid input (Mode A)
      EXPLICIT="{{input.mr_iids}}"
      EXPLICIT=$(printf '%s' "$EXPLICIT" | tr -d '[:space:]')

      if [ -n "$EXPLICIT" ]; then
        IIDS="$EXPLICIT"
        SRC="explicit input.mr_iids"
      else
        # Mode B — filter via glab
        AUTHOR="{{input.author}}"
        LABELS="{{input.labels}}"
        LIMIT="{{input.limit}}"
        [ -z "$LIMIT" ] && LIMIT=20

        if [ -z "$AUTHOR" ] && [ -z "$LABELS" ]; then
          {
            echo "[list-iids] ERROR: mr_iids is empty AND no filter (author/labels) provided."
            echo "[list-iids] Either set mr_iids or at least one of author/labels."
          } >&2
          exit 1
        fi

        # Resolve @me to actual username
        if [ "$AUTHOR" = "@me" ]; then
          AUTHOR=$(glab api user 2>/dev/null | jq -r '.username // empty')
          if [ -z "$AUTHOR" ]; then
            echo "[list-iids] ERROR: @me resolution failed — is glab authenticated?" >&2
            exit 1
          fi
        fi

        Q="state=opened&per_page=${LIMIT}"
        if [ -n "$AUTHOR" ]; then
          A_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$AUTHOR")
          Q="${Q}&author_username=${A_ENC}"
        fi
        if [ -n "$LABELS" ]; then
          L_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$LABELS")
          Q="${Q}&labels=${L_ENC}"
        fi

        echo "[list-iids] filter query: ${Q}" >&2
        # tr+sed instead of `paste -sd,` — BSD paste (macOS) rejects fused -sd
        IIDS=$(glab api "projects/${PID_ENC}/merge_requests?${Q}" | jq -r '.[].iid' | tr '\n' ',' | sed 's/,$//')
        SRC="filter (author=${AUTHOR:-—} labels=${LABELS:-—} limit=${LIMIT})"
      fi

      COUNT=0
      [ -n "$IIDS" ] && COUNT=$(printf '%s' "$IIDS" | tr ',' '\n' | grep -c .)

      {
        echo "[list-iids] source: ${SRC}"
        echo "[list-iids] count:  ${COUNT}"
        echo "[list-iids] iids:   ${IIDS:-<empty>}"
      } >&2

      # ONLY the CSV goes to stdout — for_each.source consumes this.
      printf '%s' "$IIDS"
    outputs:
      - name: iids
        extract: stdout

  # ── 1. Ingest — fetch MR metadata, all comments, the diff ──
  #
  # Sole source of truth for downstream nodes: source_branch,
  # target_branch, comment history (json), the current diff.
  # Files live in {{run.tmp_dir}}/mr-<iid>/ so cleanup is just
  # rm -rf pipeline-<id>/ at end of run.
  ingest:
    project: "{{input.project}}"
    worktree: false
    mode: shell
    prompt: |
      set -e
      PROJECT_ID="{{input.gitlab_project_id}}"
      MR_IID="{{mr_iid}}"
      PID_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$PROJECT_ID")
      MR_DIR="{{run.tmp_dir}}/mr-${MR_IID}"
      mkdir -p "$MR_DIR"
      META="${MR_DIR}/meta.json"
      NOTES="${MR_DIR}/notes.json"
      DIFF="${MR_DIR}/diff.txt"
      glab api "projects/${PID_ENC}/merge_requests/${MR_IID}" > "$META"
      glab api "projects/${PID_ENC}/merge_requests/${MR_IID}/notes?per_page=100&sort=asc" > "$NOTES"
      glab api "projects/${PID_ENC}/merge_requests/${MR_IID}/changes" \
        | jq -r '.changes[] | "=== \(.new_path) ===\n\(.diff)"' > "$DIFF"
      SRC=$(jq -r '.source_branch' "$META")
      TGT=$(jq -r '.target_branch' "$META")
      TITLE=$(jq -r '.title' "$META")
      AUTHOR=$(jq -r '.author.username' "$META")
      LATEST=$(jq -r '[.[] | select(.system == false)] | last.author.username // ""' "$NOTES")
      echo "SOURCE_BRANCH=${SRC}"
      echo "TARGET_BRANCH=${TGT}"
      echo "MR_TITLE=${TITLE}"
      echo "MR_AUTHOR=${AUTHOR}"
      echo "LATEST_COMMENTER=${LATEST}"
      echo "MR_DIR=${MR_DIR}"
      echo "META_FILE=${META}"
      echo "NOTES_FILE=${NOTES}"
      echo "DIFF_FILE=${DIFF}"
      TOTAL_NOTES=$(jq 'length' "$NOTES")
      HUMAN_NOTES=$(jq '[.[] | select(.system == false)] | length' "$NOTES")
      DIFF_LINES=$(wc -l < "$DIFF" | tr -d ' ')
      echo ""
      echo "=== RESULT ==="
      echo "Fetched MR !${MR_IID} '${MR_TITLE}'"
      echo "  branches:        ${SRC} → ${TGT}"
      echo "  author:          @${AUTHOR}"
      echo "  latest comment:  @${LATEST:-<none>}"
      echo "  notes:           ${TOTAL_NOTES} total, ${HUMAN_NOTES} human (skipping ${TOTAL_NOTES} - ${HUMAN_NOTES} system)"
      echo "  diff:            ${DIFF_LINES} lines"
    outputs:
      - name: ctx
        extract: stdout

  # ── 2. Triage — pure AI analysis (no shell, no worktree) ──
  #
  # Reads all notes + diff, decides ACT vs SKIP vs CLOSE vs NOOP
  # per the user_prompt policy.
  triage:
    retries: 2
    retry_delay_ms: 1500
    project: "{{input.project}}"
    worktree: false
    depends_on: [ingest]
    prompt: |
      You're triaging review feedback on GitLab MR !{{mr_iid}}.
      Read the FULL comment history and decide whether code changes
      are warranted.

      ## Triage policy (user-provided)
      {{input.user_prompt}}

      ## Context (from ingest)
      Parse this KEY=value block:

      ```
      {{nodes.ingest.outputs.ctx}}
      ```

      You get paths to:
        - NOTES_FILE — JSON array of ALL comments (latest at bottom).
          Skip entries where `system: true`.
        - DIFF_FILE  — current MR diff
        - META_FILE  — full MR metadata
      And: SOURCE_BRANCH, TARGET_BRANCH, MR_TITLE, MR_AUTHOR.

      ## Your task
      1. Read NOTES_FILE + DIFF_FILE.
      2. Identify which comments are unaddressed (not already
         resolved by later code/replies).
      3. Decide ONE of FOUR actions per the policy above:
         - `act`   The comments name a concrete, narrow code fix
                   that should be applied. The MR itself is valid;
                   it just needs more changes.
         - `skip`  Substantive comments judged as not requiring
                   code changes (genuine lgtm, approvals, questions,
                   style nits). A reply WILL be posted explaining
                   the decision.
         - `close` The MR as a whole should NOT be merged. Pick
                   this ONLY when the comments make it clear the
                   work is invalid: duplicate of another MR, wrong
                   approach, problem already fixed elsewhere,
                   reviewer explicitly says abandon / supersede /
                   close. Be conservative — when in doubt, skip,
                   never close.
         - `noop`  Nothing has changed since the last Forge run.
                   Pick this when the LATEST non-system comment is
                   from Forge itself (body starts with
                   '🤖 Forge:') OR from the same GitLab user this
                   Job runs as. NO reply will be posted, no label
                   changed, no MR action taken — completely silent.
      4. Write a `=== RESULT ===` block:
         - 1-3 sentence summary of the situation
         - List of unaddressed actionable comments (or "none")
         - Your decision rationale (especially important for close)
      5. End with EXACTLY one line on its own:
            ACTION: act
            ACTION: skip
            ACTION: close
            ACTION: noop

      DO NOT edit files or run git in this step. The result block
      gets posted verbatim on the MR by the reply step, so write
      it in user-facing language.

      Example shapes:
      ```
      === RESULT ===
      Reviewer @alice asked us to add input validation to
      `parseUrl()`. The current diff has no validation. Concrete,
      narrow ask — actionable.

      Unaddressed comments:
        - @alice: add validation for malformed URLs

      ACTION: act
      ```

      ```
      === RESULT ===
      @bob's comment is "lgtm 👍". No further changes requested.
      The diff is clean and ready for merge.

      ACTION: skip
      ```

      ```
      === RESULT ===
      @carol pointed out this MR duplicates !14600, which is
      already merged into 7.6. Continuing with this MR would
      re-introduce the same change. Recommend closing.

      ACTION: close
      ```

      ```
      === RESULT ===
      The latest non-system comment is Forge's own auto-reply
      from 2 minutes ago. No new external activity since the
      previous run. Silent exit.

      ACTION: noop
      ```
    outputs:
      - name: reasoning
        extract: result

  # ── 3. Fix — only runs the work when triage said ACT ──
  #
  # SKIP/CLOSE/NOOP paths: emit a marker in ~1s, no git, no edits.
  # ACT path: align worktree to origin/<source_branch>, edit,
  # commit, push HEAD back to source_branch.
  # Needs CLI Claude (claude-code) — API-only profiles can't git push.
  fix:
    # Claude CLI sometimes exits with a "require is not defined" on
    # stderr during early startup (intermittent, observed across
    # several iter:N retries on the same task). Higher retries + a
    # longer backoff than the default usually rides over it.
    retries: 5
    retry_delay_ms: 5000
    project: "{{input.project}}"
    branch: "mr-{{mr_iid}}"
    depends_on: [triage]
    prompt: |
      You're the FIX step. The TRIAGE step's full reply is:

      ```
      {{nodes.triage.outputs.reasoning}}
      ```

      ## First — check the decision
      Triage outputs one of FOUR actions:
        - `ACTION: act`    → continue to the ACT path below
        - `ACTION: skip`   → no code change; reply step still posts
        - `ACTION: close`  → no code change; reply step closes the MR
        - `ACTION: noop`   → no code change; reply step posts nothing

      For anything other than `ACTION: act`:
        - Do NOT touch git, do NOT edit any file.
        - Reply with ONE line literally matching the triage:
            `FIX_RESULT: skipped`   (when triage said `skip`)
            `FIX_RESULT: close`     (when triage said `close`)
            `FIX_RESULT: noop`      (when triage said `noop`)
            `FIX_RESULT: skipped`   (any unrecognized — safest)
        - End.

      If triage ended with `ACTION: act`, continue below.

      ## ACT path

      ### Context
      Reuse the ingest output:

      ```
      {{nodes.ingest.outputs.ctx}}
      ```

      → SOURCE_BRANCH, NOTES_FILE, DIFF_FILE etc. The orchestrator
      has opened a worktree on branch `mr-{{mr_iid}}` at
      `$FORGE_WORKTREE`.

      ### Steps
      1. Align the worktree to origin/<source_branch>:
           cd "$FORGE_WORKTREE"
           git fetch origin "$SOURCE_BRANCH"
           git reset --hard "origin/$SOURCE_BRANCH"
      2. Re-read NOTES_FILE + DIFF_FILE.
      3. Make ONLY the changes the actionable comments call for.
         Stay narrow.
      4. Commit + push to the MR's source branch:
           git add -A
           git commit -m "fix: address review feedback on !{{mr_iid}}"
           git push origin "HEAD:$SOURCE_BRANCH"
      5. Write a `=== RESULT ===` block (posted on the MR by reply
         step — write in user-facing language):
            - 1-3 sentence summary of what you changed
            - Bulleted list of edited files + the gist of each change
            - The commit SHA (output of `git rev-parse HEAD`)
      6. End with EXACTLY one line on its own:
            FIX_RESULT: pushed
            FIX_RESULT: failed   (if git push or any step failed —
                                  include the error in the result block)

      Example shape:
      ```
      === RESULT ===
      Added URL validation to `parseUrl()` per @alice's comment.

      Files changed:
        - src/parser.ts — added regex check before passing to URL()
        - test/parser.test.ts — added 3 cases for malformed URLs

      Commit: a1b2c3d

      FIX_RESULT: pushed
      ```
    outputs:
      - name: result
        extract: result

  # ── 4. Reply on the MR ──
  reply:
    project: "{{input.project}}"
    worktree: false
    depends_on: [fix]
    mode: shell
    prompt: |
      set -e
      PROJECT_ID="{{input.gitlab_project_id}}"
      MR_IID="{{mr_iid}}"
      PID_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$PROJECT_ID")
      INFO=$'{{nodes.ingest.outputs.ctx}}'
      while IFS='=' read -r __k __v; do [[ "$__k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && export "$__k=$__v"; done <<< "$INFO"
      # {{raw:...}} keeps real newlines in the heredoc.
      # Long unique markers + write-to-file (not the `$(cat <<EOF…EOF)`
      # form): if the LLM happens to write `FORGE_T_EOF` on a line of
      # its own the heredoc terminates early and bash starts parsing
      # the rest of the value as commands → syntax error near the
      # outer `)`. Long markers + plain `cat > file <<EOF` decouple
      # the parse so a hit only breaks that file write, not the rest.
      # MR_DIR comes from ingest INFO above.
      mkdir -p "$MR_DIR"
      cat > "${MR_DIR}/triage" <<'__FORGE_TRIAGE_EOF_x7k9z2q4__'
      {{raw:nodes.triage.outputs.reasoning}}
      __FORGE_TRIAGE_EOF_x7k9z2q4__
      cat > "${MR_DIR}/fix" <<'__FORGE_FIX_EOF_x7k9z2q4__'
      {{raw:nodes.fix.outputs.result}}
      __FORGE_FIX_EOF_x7k9z2q4__
      TRIAGE=$(cat "${MR_DIR}/triage")
      FIX=$(cat "${MR_DIR}/fix")
      if echo "$FIX" | grep -Eq '(^|[[:space:]])FIX_RESULT:[[:space:]]*noop([[:space:]]|$)'; then
        # Silent path: triage determined nothing has changed since
        # the last Forge run. Don't post a reply.
        STATUS="noop"
        echo "STATUS=noop"
        echo "REPLY_POSTED=false"
        echo "NOTE_ID="
        echo "LABEL_RESULT=not changed"
        echo "CLOSE_RESULT=not closed"
        echo ""
        echo "=== RESULT ==="
        echo "MR !${MR_IID} noop — latest comment is from Forge or this Job's user. No reply posted, no labels changed."
        exit 0
      elif echo "$FIX" | grep -Eq '(^|[[:space:]])FIX_RESULT:[[:space:]]*pushed([[:space:]]|$)'; then
        STATUS="pushed"
        BODY="🤖 Forge: pushed a fixup commit addressing the review feedback.

      **Triage:**
      ${TRIAGE}

      **Fix summary:**
      ${FIX}"
      elif echo "$FIX" | grep -Eq '(^|[[:space:]])FIX_RESULT:[[:space:]]*close([[:space:]]|$)'; then
        STATUS="close"
        BODY="🤖 Forge: this MR is being closed — the review concluded the work shouldn't be merged.

      ${TRIAGE}"
      elif echo "$FIX" | grep -Eq '(^|[[:space:]])FIX_RESULT:[[:space:]]*skipped([[:space:]]|$)'; then
        STATUS="skipped"
        BODY="🤖 Forge: reviewed the latest comments — **no code change needed**.

      ${TRIAGE}"
      elif echo "$FIX" | grep -Eq '(^|[[:space:]])FIX_RESULT:[[:space:]]*failed([[:space:]]|$)'; then
        STATUS="failed"
        BODY="⚠️ Forge: triage decided to fix but applying the change failed. Human attention required.

      **Triage:**
      ${TRIAGE}

      **Failure:**
      ${FIX}"
      else
        STATUS="unknown"
        BODY="⚠️ Forge: fix step did not emit a FIX_RESULT marker. Human review required.

      ${FIX}"
      fi
      NOTE_ID=$(glab api "projects/${PID_ENC}/merge_requests/${MR_IID}/notes" \
        -X POST -f body="$BODY" 2>/dev/null | jq -r '.id // empty') || NOTE_ID=""
      if [ -n "$NOTE_ID" ]; then
        REPLY_POSTED="true"
      else
        REPLY_POSTED="false"
      fi

      # Per-STATUS side-effects on the MR itself:
      #   skipped → verdict label forge:no-fix-needed
      #   close   → verdict label forge:no-merge + close the MR
      #   pushed  → verdict label forge:fix-applied
      # PLUS in every terminal case (skipped/close/pushed/failed), set
      # the stage label forge:stage::needs-review — pre-review pipeline
      # later flips it to forge:stage::reviewed or ::needs-fix based on
      # verdict. Mutually exclusive with the other forge:stage::* labels.
      # All best-effort: missing labels return 4xx, we log + continue.
      LABEL_RESULT="not changed"
      CLOSE_RESULT="not closed"
      STAGE_LABEL="not set"
      case "$STATUS" in
        skipped)
          if glab api "projects/${PID_ENC}/merge_requests/${MR_IID}" \
               -X PUT -f "add_labels=forge:no-fix-needed" \
               > /dev/null 2>&1; then
            LABEL_RESULT="added forge:no-fix-needed"
          else
            LABEL_RESULT="failed to add forge:no-fix-needed (label may not exist in project)"
          fi
          ;;
        close)
          if glab api "projects/${PID_ENC}/merge_requests/${MR_IID}" \
               -X PUT -f "add_labels=forge:no-merge" \
               > /dev/null 2>&1; then
            LABEL_RESULT="added forge:no-merge"
          else
            LABEL_RESULT="failed to add forge:no-merge (label may not exist in project)"
          fi
          if glab api "projects/${PID_ENC}/merge_requests/${MR_IID}" \
               -X PUT -f "state_event=close" \
               > /dev/null 2>&1; then
            CLOSE_RESULT="MR closed"
          else
            CLOSE_RESULT="failed to close MR — check glab permissions"
          fi
          ;;
        pushed)
          if glab api "projects/${PID_ENC}/merge_requests/${MR_IID}" \
               -X PUT -f "add_labels=forge:fix-applied" \
               > /dev/null 2>&1; then
            LABEL_RESULT="added forge:fix-applied"
          else
            LABEL_RESULT="failed to add forge:fix-applied (label may not exist in project)"
          fi
          ;;
      esac

      # Stage label — every terminal status (skipped/close/pushed/failed)
      # → forge:stage::needs-review so pre-review picks it back up.
      if glab api "projects/${PID_ENC}/merge_requests/${MR_IID}" -X PUT \
           -f "add_labels=forge:stage::needs-review" \
           -f "remove_labels=forge:stage::needs-fix,forge:stage::reviewed" \
           > /dev/null 2>&1; then
        STAGE_LABEL="forge:stage::needs-review"
      else
        STAGE_LABEL="failed (project may lack the label — create it once: Settings → Labels)"
      fi

      echo "STATUS=${STATUS}"
      echo "REPLY_POSTED=${REPLY_POSTED}"
      echo "NOTE_ID=${NOTE_ID}"
      echo "LABEL_RESULT=${LABEL_RESULT}"
      echo "STAGE_LABEL=${STAGE_LABEL}"
      echo "CLOSE_RESULT=${CLOSE_RESULT}"
      echo ""
      echo "=== RESULT ==="
      echo "MR !${MR_IID} reply: status=${STATUS}"
      if [ -n "$NOTE_ID" ]; then
        echo "  posted as note #${NOTE_ID}"
      else
        echo "  POST failed — see glab error above"
      fi
      echo "  Verdict label: ${LABEL_RESULT}"
      echo "  Stage label:   ${STAGE_LABEL}"
      if [ "$STATUS" = "close" ]; then
        echo "  Close: ${CLOSE_RESULT}"
      fi
    outputs:
      - name: result
        extract: stdout

  # ── 5. Cleanup + Teams notify ──
  cleanup:
    project: "{{input.project}}"
    worktree: false
    depends_on: [reply]
    mode: shell
    prompt: |
      set +e
      INFO=$'{{nodes.ingest.outputs.ctx}}'
      while IFS='=' read -r __k __v; do [[ "$__k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && export "$__k=$__v"; done <<< "$INFO"
      STATUS_OUT=$'{{nodes.reply.outputs.result}}'
      while IFS='=' read -r __k __v; do [[ "$__k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && export "$__k=$__v"; done <<< "$STATUS_OUT"

      # Teams notification DISABLED (commented out per user request 2026-05-26).
      # Code preserved verbatim below for future re-enable.
      TEAMS_RESULT="disabled (commented out)"
      # TARGET="${LATEST_COMMENTER:-$MR_AUTHOR}"
      # MR_URL=$(jq -r '.web_url // empty' "$META_FILE")
      # MSG="🤖 Forge handled MR review on \"${MR_TITLE}\" (status: ${STATUS:-?})
      #
      # MR: ${MR_URL}"
      # PAYLOAD=$(jq -n --arg user "$TARGET" --arg msg "$MSG" \
      #   '{plugin_id:"teams", tool:"send_message", input:{chat_name:$user, message:$msg}}')
      # if curl -sS -X POST http://127.0.0.1:8403/api/connector-tool \
      #      -H 'content-type: application/json' --data "$PAYLOAD" \
      #      > /dev/null 2>&1; then
      #   TEAMS_RESULT="notified @${TARGET}"
      # else
      #   TEAMS_RESULT="skipped (connector unreachable or not configured)"
      # fi

      # Remove worktree (only exists if ACT path ran)
      ROOT=$(git rev-parse --show-toplevel)
      WT="$ROOT/.forge/worktrees/mr-{{mr_iid}}"
      if [ -d "$WT" ]; then
        if git worktree remove --force "$WT" 2>/dev/null; then
          WT_RESULT="removed $WT"
        else
          WT_RESULT="could NOT remove $WT (may hold uncommitted changes)"
        fi
      else
        WT_RESULT="none (SKIP path — worktree was never created)"
      fi
      git worktree prune >/dev/null 2>&1
      # Per-MR scratch dir lives under {{run.tmp_dir}} now; framework
      # wipes the whole pipeline-<id>/ on `done`, so we don't need to
      # rm anything here. Left out the old `rm /tmp/...` lines.
      echo "=== RESULT ==="
      echo "Pipeline outcome:    ${STATUS:-?}"
      echo "Teams notification:  ${TEAMS_RESULT}"
      echo "Worktree:            ${WT_RESULT}"
      echo "Tmp dir:             {{run.tmp_dir}} (auto-cleaned on done)"
    outputs:
      - name: status
        extract: stdout
