name: gitlab-mr-watch
display_name: "GitLab MR auto-fix (single MR)"
description: |
  Watch new comments on one specific GitLab MR.
  Each new review note dispatches the `mr-review-fix` pipeline — Claude
  reads the comment + the current MR diff, edits files in the matching
  local project, and pushes a fixup commit.
version: "0.4.0"
author: "forge"
tags: ["gitlab", "mr", "claude-code", "review"]

params:
  - name: project
    label: "Local project name"
    type: project_picker
    required: true
    help: "The directory under your projectRoots; e.g. FortiNAC."

  - name: mr_url
    label: "MR URL"
    type: gitlab_mr_url
    required: true
    help: |
      Paste the full URL of the MR. Forge parses out the
      `namespace/repo` and the `iid` for you — no need to look them
      up manually. Example:
        https://dops-git106.fortinet-us.com/fortinac/FortiNAC/-/merge_requests/14656

  - name: schedule_minutes
    label: "Poll interval (minutes)"
    type: number
    default: 5

  - name: triage_instructions
    label: "Triage policy (free-form, optional)"
    help: |
      Describe in plain text WHEN Claude should act vs skip. Leave
      empty to use defaults (skip self/system/approvals/lgtm). Example:
      "Only act if the reviewer points at a specific code defect or
      missing test. Skip style nits, comments-only changes, and any
      message from @ci-bot."

job:
  name_template: "mr-watch-{{params.project}}-{{params.mr_url__iid}}"
  enabled: true
  schedule_kind: "period"
  schedule_interval_minutes: "{{params.schedule_minutes}}"

  source_connector: "gitlab"
  source_tool: "list_mr_notes"
  source_input:
    project_id: "{{params.mr_url__path}}"
    mr_iid: "{{params.mr_url__iid}}"
    per_page: 50
    sort: "desc"
  items_path: ""
  dedup_field: "id"

  dispatch_type: "pipeline"
  dispatch_params:
    workflow_name: "mr-review-fix"
    project_path: "{{env.HOME}}/IdeaProjects/{{params.project}}"
    project_name: "{{params.project}}"
    input_template:
      project: "{{params.project}}"
      gitlab_project_id: "{{params.mr_url__path}}"
      mr_iid: "{{params.mr_url__iid}}"
      mr_title: ""
      mr_url: "{{params.mr_url}}"
      reviewer: "{{item.author.username}}"
      feedback: "{{item.body}}"
      is_system: "{{item.system}}"
      action: "review_submitted"
      triage_instructions: "{{params.triage_instructions}}"
