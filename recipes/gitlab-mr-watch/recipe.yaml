name: gitlab-mr-watch
display_name: "GitLab MR auto-fix (single MR)"
description: |
  Watch one specific GitLab MR for new review comments. When the
  comment count changes (someone added a note), the `mr-review-fix`
  pipeline runs ONCE — it fetches all comments itself and triages
  them holistically.

  Per-Fire behaviour:
    - No new comments  → no dispatch
    - 1+ new comments  → exactly 1 pipeline run
    (Unlike v0.4 which fired 1 pipeline per new note.)
version: "0.5.0"
author: "forge"
tags: ["gitlab", "mr", "claude-code", "review"]

params:
  - name: project
    label: "Local project name"
    type: project_picker
    required: true
    help: "The directory under your projectRoots; e.g. FortiNAC."

  - name: mr_url
    label: "MR URL"
    type: gitlab_mr_url
    required: true
    help: |
      Paste the full URL of the MR. Forge parses out
      `namespace/repo` and `iid` for you. Example:
        https://dops-git106.fortinet-us.com/fortinac/FortiNAC/-/merge_requests/14656

  - name: schedule_minutes
    label: "Poll interval (minutes)"
    type: number
    default: 5

  - name: triage_instructions
    label: "Triage policy (free-form, optional)"
    default: |
      ACT on any concrete code change request from a human reviewer
      (missing cleanup, refactor with clear rationale, bug, missing
      test, security concern) AND on 'error' findings from code review
      bots.

      SKIP approvals / lgtm / style-nits / questions / bot warnings
      about MR metadata.

      NOOP (do nothing, post no reply) when the latest non-system
      comment was authored by Forge itself (body starts with
      '🤖 Forge:') OR by the same GitLab user this Job runs as.
      Nothing has changed since the last Forge run.
    help: |
      Describe in plain text WHEN Claude should act vs skip vs close
      vs noop. The default covers the common cases — overwrite if
      you have project-specific rules (e.g. "only act when reviewer
      is from team @backend").

job:
  name_template: "mr-watch-{{params.project}}-{{params.mr_url__iid}}"
  enabled: true
  schedule_kind: "period"
  schedule_interval_minutes: "{{params.schedule_minutes}}"

  source_connector: "gitlab"
  source_tool: "get_mr"
  source_input:
    project_id: "{{params.mr_url__path}}"
    mr_iid: "{{params.mr_url__iid}}"
    # First tick: register the current state (notes count) as "seen"
    # without dispatching anything. Otherwise the very first poll
    # would treat the existing notes count as "new" and trigger.
    __mark_existing_as_seen: true
  items_path: ""
  # `get_mr` returns ONE MR object; scheduler wraps as 1-item list.
  # Dedup on user_notes_count — changes ONLY when someone adds/
  # removes a comment. Label changes, assignee changes, status
  # changes etc. don't bump this counter, so we don't false-fire.
  dedup_field: "user_notes_count"

  dispatch_type: "pipeline"
  dispatch_params:
    workflow_name: "mr-review-fix"
    project_path: "{{env.HOME}}/IdeaProjects/{{params.project}}"
    project_name: "{{params.project}}"
    input_template:
      project: "{{params.project}}"
      gitlab_project_id: "{{params.mr_url__path}}"
      mr_iid: "{{params.mr_url__iid}}"
      mr_url: "{{params.mr_url}}"
      triage_instructions: "{{params.triage_instructions}}"
