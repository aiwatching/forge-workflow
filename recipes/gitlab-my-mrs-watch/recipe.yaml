name: gitlab-my-mrs-watch
display_name: "GitLab — watch ALL my MRs for review feedback"
description: |
  Auto-monitor every open MR you authored across all GitLab projects
  the token can see. Each new "review_submitted" Todo dispatches the
  mr-review-fix pipeline — Claude reads the reviewer's comment + the
  current MR diff, edits files, pushes a fixup commit, and replies.

  No MR ids to maintain — uses GitLab's Todos API, the same set that
  appears in the web UI ✓Todos panel. Filters in vars (self-reviews,
  bots, "LGTM"-style notes) live inside mr-review-fix.yaml — edit it
  to tune.

  Dependencies: glab CLI authenticated; mr-review-fix pipeline
  installed locally (auto-installed when this recipe runs the first
  time, or via Marketplace).
version: "0.2.0"
author: "forge"
tags: ["gitlab", "mr", "claude-code", "review", "auto"]

params:
  - name: project
    label: "Local project name (where Claude will checkout + edit code)"
    type: project_picker
    required: true
    help: |
      All review comments dispatch into THIS project. If you watch MRs
      across multiple repos, create one instance of this recipe per
      project + set gitlab_project_id_filter to scope each.

  - name: gitlab_project_id_filter
    label: "GitLab project_id (optional — leave empty for ALL projects)"
    type: number
    help: |
      Limit the Todo poll to a single GitLab project. Recommended if
      you only want this recipe instance to act on MRs in one repo —
      avoids cross-project misfires.

  - name: action
    label: "Todo action to watch"
    type: select
    default: "review_submitted"
    options:
      - review_submitted
      - mentioned
      - directly_addressed
    help: |
      review_submitted = reviewer finished + left feedback (recommended)
      mentioned        = anyone @-mentioned you in a comment
      directly_addressed = mentioned on a top-level line (rare)

  - name: schedule_minutes
    label: "Poll interval (minutes)"
    type: number
    default: 5

  - name: triage_instructions
    label: "Triage policy (free-form, optional)"
    help: |
      Describe in plain text WHEN Claude should act vs skip on a new
      review comment. Leave empty to use defaults (skip self/system/
      approvals/lgtm). Example:
      "Only act on comments that name a concrete bug, missing test,
      or required refactor. Skip nits about style or naming, comments
      flagged as suggestions only, and approvals."

job:
  name_template: "watch-my-mrs-{{params.project}}"
  enabled: true
  schedule_kind: "period"
  schedule_interval_minutes: "{{params.schedule_minutes}}"

  source_connector: "gitlab"
  source_tool: "list_my_todos"
  source_input:
    target_type: "MergeRequest"
    action: "{{params.action}}"
    project_id: "{{params.gitlab_project_id_filter}}"
    per_page: 50
  items_path: ""
  dedup_field: "id"

  dispatch_type: "pipeline"
  dispatch_params:
    workflow_name: "mr-review-fix"
    project_path: "{{env.HOME}}/IdeaProjects/{{params.project}}"
    project_name: "{{params.project}}"
    input_template:
      project: "{{params.project}}"
      gitlab_project_id: "{{item.project.id}}"
      mr_iid: "{{item.target.iid}}"
      mr_title: "{{item.target.title}}"
      mr_url: "{{item.target_url}}"
      action: "{{item.action_name}}"
      reviewer: "{{item.author.username}}"
      feedback: "{{item.body}}"
      is_system: ""
      triage_instructions: "{{params.triage_instructions}}"
